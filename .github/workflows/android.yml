name: APK

on:
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # aapt2, dx, apksig and the framework jar all come from Maven Central. The framework
      # jar is the large one, so it is worth keeping between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nur-android
          key: nur-android-tools-v1

      # Optional: store a base64 PKCS#12 keystore as the NUR_KEYSTORE_BASE64 secret and every
      # build will be signed with the same key, so each one installs over the last. Without
      # it the build makes a throwaway key and the APK has to be installed fresh.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/nur.p12
            echo "signing with the stored key"
          else
            echo "no NUR_KEYSTORE_BASE64 secret; the build will make a throwaway key"
          fi

      - name: Build
        env:
          NUR_KEYSTORE_PASS: ${{ secrets.NUR_KEYSTORE_PASS || 'nur-signing-key' }}
        run: tools/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nur-apk
          path: dist/*.apk
          if-no-files-found: error
