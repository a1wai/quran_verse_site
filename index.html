<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="nur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Nur — a verse for where you are</title>
<meta name="description" content="One verse of the Qur'an at a time, matched to how you feel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@200;300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --glow:#8fa7ff;
  --ink:#f4f6ff; --ink-dim:rgba(244,246,255,.58); --ink-faint:rgba(244,246,255,.34);
  --line:rgba(244,246,255,.14); --panel:rgba(6,9,18,.86); --field:rgba(255,255,255,.05);
  --verse-size:clamp(1.42rem, 3.4vw + .55rem, 2.6rem);
  --f-display:'Spectral',Georgia,serif; --f-ui:'Jost',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --scene-filter:none; --bg:#05070d;
}
html[data-theme="light"]{
  --ink:#1c1813; --ink-dim:rgba(28,24,19,.66); --ink-faint:rgba(28,24,19,.42);
  --line:rgba(28,24,19,.17); --panel:rgba(247,244,237,.92); --field:rgba(28,24,19,.05);
  --scene-filter:invert(1) hue-rotate(180deg) saturate(.72) brightness(1.05); --bg:#f7f4ed;
}
html[data-font="classic"]{--f-display:'EB Garamond',Georgia,serif;--f-ui:'Inter',system-ui,sans-serif}
html[data-font="modern"]{--f-display:'Inter',system-ui,sans-serif;--f-ui:'Inter',system-ui,sans-serif}
html[data-font="scribe"]{--f-display:'Amiri',Georgia,serif;--f-ui:'Jost',system-ui,sans-serif}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:300;
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease),color .5s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink-dim);outline-offset:5px;border-radius:2px}

#scene{position:fixed;inset:0;z-index:0;display:block;filter:var(--scene-filter);transition:filter .5s var(--ease)}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 78% 58% at 50% 46%, rgba(4,6,13,.58), rgba(4,6,13,.14) 62%, rgba(4,6,13,.68) 100%)}
html[data-theme="light"] #veil{background:radial-gradient(ellipse 80% 60% at 50% 46%, rgba(255,253,247,.66), rgba(255,253,247,.22) 62%, rgba(255,253,247,.72) 100%)}

#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  padding:clamp(26px,7vw,80px) clamp(22px,6vw,64px) 132px;cursor:pointer;
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}
#stage::-webkit-scrollbar{display:none}
.slab{width:100%;max-width:min(56ch,92vw);margin:auto 0;text-align:center;
  transition:opacity .6s var(--ease), transform .6s var(--ease), filter .6s var(--ease)}
.slab.out{opacity:0;transform:translateY(-14px) scale(.995);filter:blur(6px)}
.slab.in{opacity:0;transform:translateY(14px);filter:blur(6px)}

#verse{font-family:var(--f-display);font-weight:300;font-size:var(--verse-size);
  line-height:1.5;letter-spacing:.004em;text-wrap:balance;max-width:34ch;margin:0 auto;
  text-shadow:0 1px 34px rgba(0,0,0,.5)}
html[data-theme="light"] #verse{text-shadow:0 1px 26px rgba(255,255,255,.7)}
#verse .gloss{opacity:.62}
#verse.rtl{direction:rtl;line-height:1.85}
#verse.arabic{font-family:'Amiri',serif;font-size:clamp(1.7rem,4.4vw,3rem);line-height:1.95}
#ref{margin-top:clamp(20px,3.4vh,34px);font-size:.66rem;font-weight:400;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink-faint)}
#ref .sep{opacity:.4;margin:0 .55em}
#ref .liked{color:var(--glow);margin-inline-start:.6em}

.story #verse{font-size:clamp(1.02rem,1.5vw + .62rem,1.28rem);line-height:1.78;max-width:52ch;text-align:start}
.story .story-title{display:block;font-family:var(--f-ui);font-weight:400;font-size:.72rem;
  letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:clamp(18px,3vh,28px);text-align:start}
.story .story-hold{display:block;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
  font-family:var(--f-display);font-style:italic;font-weight:300;color:var(--ink-dim);font-size:.98em;text-align:start}
.story #ref{text-align:start}
.pulse{display:block;height:1px;width:112px;margin:0 auto;background:var(--ink-faint);animation:breathe 1.5s ease-in-out infinite}

#hint{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));z-index:3;
  text-align:center;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint);
  opacity:0;transition:opacity .6s;pointer-events:none}
#hint.on{opacity:.75}

#pill{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:4;display:none;align-items:center;gap:10px;padding:8px 10px 8px 16px;
  border:1px solid var(--line);border-radius:999px;background:var(--field);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim);max-width:80vw}
#pill.on{display:flex}
#pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pill button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;
  line-height:1;color:var(--ink-faint);border:1px solid transparent;flex:0 0 auto}
#pill button:hover{color:var(--ink);border-color:var(--line)}

#heartfx{position:fixed;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none;opacity:0}
#heartfx svg{width:min(38vw,190px);height:auto;color:var(--glow)}
#heartfx.beat{animation:heartbeat 1.05s var(--ease) forwards}
@keyframes heartbeat{
  0%{opacity:0;transform:scale(.55)} 22%{opacity:1;transform:scale(1.08)}
  40%{transform:scale(.98)} 62%{opacity:.9;transform:scale(1.02)}
  100%{opacity:0;transform:scale(1.16)}
}

#dotwrap{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5}
#dot{position:relative;display:grid;place-items:center;width:66px;height:66px;border-radius:50%}
#dot::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--ink);
  box-shadow:0 0 14px var(--glow), 0 0 44px var(--glow);border:1.5px solid transparent;
  transition:width .5s var(--ease),height .5s var(--ease),background .4s,border-color .4s,box-shadow .5s;
  animation:breathe 5s ease-in-out infinite}
#dot[aria-expanded="true"]::after{width:34px;height:34px;background:transparent;
  border-color:var(--ink);box-shadow:0 0 26px var(--glow);animation:none}

/* the menu: hidden means gone — no invisible buttons left sitting over the page */
#bloom{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding-bottom:calc(104px + env(safe-area-inset-bottom));
  pointer-events:none;visibility:hidden;transition:visibility 0s linear .46s}
#bloom.open{visibility:visible;transition-delay:0s}
#bloom button{pointer-events:none;opacity:0;transform:translateY(12px);padding:13px 30px;border-radius:999px;
  font-size:.8rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);
  text-shadow:0 1px 18px rgba(0,0,0,.5);
  transition:opacity .4s var(--ease),transform .4s var(--ease),color .25s}
html[data-theme="light"] #bloom button{text-shadow:0 1px 16px rgba(255,255,255,.75)}
#bloom button:hover{color:var(--ink)}
#bloom.open button{pointer-events:auto;opacity:1;transform:translateY(0)}
#bloom.open button:nth-child(7){transition-delay:.02s}
#bloom.open button:nth-child(6){transition-delay:.06s}
#bloom.open button:nth-child(5){transition-delay:.10s}
#bloom.open button:nth-child(4){transition-delay:.14s}
#bloom.open button:nth-child(3){transition-delay:.18s}
#bloom.open button:nth-child(2){transition-delay:.22s}
#bloom.open button:nth-child(1){transition-delay:.26s}
/* the menu backdrop: everything behind it goes soft */
#scrim{position:fixed;inset:0;z-index:3;opacity:0;pointer-events:none;
  background:rgba(3,5,11,.44);backdrop-filter:blur(18px) saturate(.82);-webkit-backdrop-filter:blur(18px) saturate(.82);
  transition:opacity .42s var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
html[data-theme="light"] #scrim{background:rgba(247,244,237,.52)}

.panel{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;background:var(--panel);
  backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px) saturate(120%)}
.panel.on{display:flex;animation:panelIn .44s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.phead{display:flex;align-items:center;gap:16px;flex:0 0 auto;
  padding:max(18px,env(safe-area-inset-top)) clamp(18px,5vw,44px) 18px;border-bottom:1px solid var(--line)}
.back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--ink-dim);flex:0 0 auto}
.back:hover{color:var(--ink)}
.ptitle{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim)}
.pbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:clamp(24px,5vh,44px) clamp(18px,5vw,44px) calc(56px + env(safe-area-inset-bottom))}
.pinner{max-width:760px;margin:0 auto}
.lede{font-family:var(--f-display);font-weight:300;font-size:1.06rem;line-height:1.7;color:var(--ink-dim);
  margin-bottom:clamp(20px,4vh,32px);max-width:46ch}

.gtitle{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);
  margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.gtitle:first-of-type{margin-top:0}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.mood{position:relative;text-align:start;padding:18px 16px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--field);transition:border-color .3s,transform .3s var(--ease)}
.mood:hover{border-color:var(--ink-dim);transform:translateY(-2px)}
.mood .m-n{display:block;font-family:var(--f-display);font-size:1.1rem;font-weight:300}
.mood .m-s{display:block;margin-top:5px;font-size:.7rem;letter-spacing:.06em;color:var(--ink-faint);line-height:1.5}
.mood .m-c{display:block;margin-top:8px;font-size:.58rem;letter-spacing:.2em;color:var(--ink-faint);opacity:.7}
.mood .m-d{position:absolute;top:15px;inset-inline-end:15px;width:5px;height:5px;border-radius:50%}
.wide{width:100%;padding:16px 18px;border:1px dashed var(--line);border-radius:14px;text-align:start;
  margin-bottom:24px;transition:border-color .3s}
.wide:hover{border-color:var(--ink-dim)}
.wide .w-n{display:block;font-family:var(--f-display);font-size:1.06rem}
.wide .w-s{display:block;margin-top:4px;font-size:.72rem;color:var(--ink-faint);line-height:1.5}

.search,.ta{width:100%;padding:13px 16px;background:var(--field);border:1px solid var(--line);
  border-radius:10px;color:var(--ink);font-size:.94rem;font-family:var(--f-ui)}
.search{margin-bottom:20px}
.ta{min-height:110px;resize:vertical;line-height:1.6}
.search::placeholder,.ta::placeholder{color:var(--ink-faint)}
.search:focus,.ta:focus{outline:none;border-color:var(--ink-dim)}
.cta{margin-top:14px;padding:12px 24px;border:1px solid var(--ink-dim);border-radius:999px;
  font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}
.cta[disabled]{opacity:.45;cursor:default}

.langs{display:flex;flex-direction:column}
.lang{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 4px;
  border-bottom:1px solid var(--line);text-align:start;transition:padding-inline-start .3s var(--ease)}
.lang:hover{padding-inline-start:10px}
.lang .l-n{font-family:var(--f-display);font-size:1.04rem;font-weight:300}
.lang .l-t{font-size:.68rem;letter-spacing:.08em;color:var(--ink-faint);text-align:end;flex:0 0 auto;max-width:54%}
.lang[aria-current="true"] .l-n::after{content:" ·";color:var(--glow)}
.note{font-size:.78rem;line-height:1.7;color:var(--ink-faint);letter-spacing:.02em;
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.note b{color:var(--ink-dim);font-weight:400}

.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.row .r-n{font-family:var(--f-display);font-size:1.06rem;font-weight:300}
.row .r-s{font-size:.72rem;letter-spacing:.03em;color:var(--ink-faint);margin-top:4px;line-height:1.55;max-width:44ch}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.seg button{padding:8px 14px;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
  transition:background .25s,color .25s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.foot{margin-top:34px;font-size:.74rem;line-height:1.9;color:var(--ink-faint);letter-spacing:.02em}
.foot a{color:var(--ink-dim)}

.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;
  background:var(--field);text-align:start;width:100%}
.hitem .h-t{font-family:var(--f-display);font-size:1rem;font-weight:300;line-height:1.6;flex:1 1 auto}
.hitem .h-r{display:block;margin-top:8px;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
.hitem .h-x{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  color:var(--ink-faint);display:grid;place-items:center;font-size:.8rem}
.empty{font-family:var(--f-display);font-size:1.04rem;color:var(--ink-dim);line-height:1.7;max-width:40ch}

/* sheets */
.sheet{position:fixed;inset:0;z-index:8;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .sbg{position:absolute;inset:0;background:rgba(2,4,10,.52);
  backdrop-filter:blur(20px) saturate(.82);-webkit-backdrop-filter:blur(20px) saturate(.82)}
html[data-theme="light"] .sheet .sbg{background:rgba(247,244,237,.52)}
.sheet .sbg{opacity:0;transition:opacity .42s var(--ease)}
.sheet.on .sbg{opacity:1}
.sheet.closing .sbg{opacity:0}
.sheet .scard{position:relative;width:min(600px,100%);max-height:82vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:14px clamp(20px,5vw,32px) calc(30px + env(safe-area-inset-bottom));
  animation:sheetIn .44s var(--ease) both;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  touch-action:pan-y}
.sheet.closing .scard{animation:sheetOut .32s var(--ease) both}
.sheet .scard.dragging{animation:none;transition:none}
/* the handle you pull down on */
.sheet .grip{display:block;width:44px;height:4px;border-radius:999px;background:var(--ink-faint);
  opacity:.5;margin:0 auto 14px}
@media(min-width:720px){.sheet{align-items:center}.sheet .scard{border-radius:22px}}
@keyframes sheetIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(60px)}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.shead h3{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);font-weight:400}
.shead button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);color:var(--ink-faint);
  display:grid;place-items:center;font-size:.8rem}
.sbody{font-family:var(--f-display);font-weight:300;font-size:1rem;line-height:1.78;color:var(--ink)}
.sbody p{margin-bottom:12px}
.sbody .quiet{color:var(--ink-faint);font-family:var(--f-ui);font-size:.8rem;line-height:1.7}
.sbody .cta{display:inline-block;margin:2px 0 6px}
.sbody .src{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-family:var(--f-ui);font-size:.7rem;letter-spacing:.04em;line-height:1.7;color:var(--ink-faint)}
.sbody .sref{font-family:var(--f-ui);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:14px}

/* the small word that appears when you keep something */
#toast{position:fixed;left:50%;bottom:calc(148px + env(safe-area-inset-bottom));transform:translate(-50%,8px);
  z-index:10;pointer-events:none;opacity:0;
  padding:9px 18px;border-radius:999px;border:1px solid var(--line);
  background:rgba(6,9,18,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);
  white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] #toast{background:rgba(247,244,237,.82)}
#toast.on{animation:toastPop 2.1s var(--ease) forwards}
@keyframes toastPop{
  0%{opacity:0;transform:translate(-50%,10px)}
  14%{opacity:1;transform:translate(-50%,0)}
  76%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-6px)}
}

@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
@media (max-width:600px){
  #stage{padding-bottom:120px}
  .moods{grid-template-columns:repeat(2,1fr);gap:8px}
  .row{flex-direction:column;align-items:flex-start;gap:12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.12s !important}
  #dot::after{animation:none;opacity:1}
  #heartfx.beat{animation-duration:.9s !important}
}
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>

<main id="stage" role="button" tabindex="0" aria-label="Show another verse">
  <div class="slab" id="slab">
    <p id="verse"><span class="pulse"></span></p>
    <p id="ref"></p>
  </div>
</main>

<div id="hint"></div>

<div id="pill" aria-live="polite">
  <span id="pill-label"></span>
  <button id="pill-clear" aria-label="Clear">✕</button>
</div>

<div id="heartfx" aria-hidden="true">
  <svg viewBox="0 0 100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 86C50 86 8 60.5 8 33.5 8 19.4 19.2 8 33.1 8 41.3 8 47.4 12.4 50 17.6 52.6 12.4 58.7 8 66.9 8 80.8 8 92 19.4 92 33.5 92 60.5 50 86 50 86Z"
      fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" transform="translate(-4,0)"/>
    <path d="M50 74C50 74 22 56 22 37.5 22 28.4 29 21 37.8 21 43 21 47.2 23.9 50 28 52.8 23.9 57 21 62.2 21 71 21 78 28.4 78 37.5 78 56 50 74 50 74Z"
      stroke="currentColor" stroke-width="1.2" stroke-opacity=".55" fill="none"/>
    <circle cx="50" cy="44" r="3" fill="currentColor" fill-opacity=".5"/>
  </svg>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="scrim"></div>

<nav id="bloom" aria-hidden="true">
  <button data-open="about" data-i18n="menu.about">About</button>
  <button data-open="settings" data-i18n="menu.settings">Settings</button>
  <button data-open="language" data-i18n="menu.language">Language</button>
  <button data-open="favorites" data-i18n="menu.favorites">Favorites</button>
  <button data-open="stories" data-i18n="menu.stories">Events</button>
  <button data-open="mood" data-i18n="menu.mood">Mood</button>
  <button data-open="explain" data-i18n="menu.explain">Explain</button>
</nav>

<div id="dotwrap"><button id="dot" aria-expanded="false" aria-controls="bloom" aria-label="Open menu"></button></div>

<section class="panel" id="p-mood">
  <div class="phead"><button class="back" data-close aria-label="Back">←</button><h2 class="ptitle" data-i18n="mood.title">Mood</h2></div>
  <div class="pbody"><div class="pinner">
    <p class="lede" data-i18n="mood.lede">Name where you are right now. You'll be given verses that meet you there, in a different order every time.</p>
    <button class="wide" id="sharemood">
      <span class="w-n" data-i18n="mood.share">Say it in your own words</span>
      <span class="w-s" data-i18n="mood.shareSub">Write a sentence about how you are, and the right verses will be chosen for it.</span>

/* 377 verses, Rowwad Translation Center edition, bundled so a verse never needs a network */
const V=[[1,5,"lost","birds","You alone we worship, and You alone we ask for help"],[1,6,"lost","path","Guide us to the straight path"],[2,2,"doubt lost","mountains","This is the Book about which there is no doubt, a guidance for the righteous"],[2,38,"afraid","mist","We said, “Go down all of you from here! Then when My guidance comes to you; whoever follows My guidance, they will have no fear, nor will they grieve"],[2,45,"anxious worn","garden","Seek help through patience and prayer. It is strenuous except for the humble"],[2,112,"afraid peace","dawn","On the contrary, whoever submits himself to Allah and is a doer of good will have his reward with his Lord. They will have no fear, nor will they grieve"],[2,152,"alone grateful","mist","Therefore remember Me; I will remember you. Be grateful to Me, and do not be ungrateful"],[2,153,"anxious worn","hills","O you who believe, seek help in patience and prayer, for Allah is with those who are patient"],[2,154,"death","mountains","And do not say that those martyred in Allah’s way are dead. Rather, they are alive, but you do not perceive it"],[2,155,"heavy sick","garden","We will surely test you with something of fear and famine, and loss of property, lives and fruits. But give glad tidings to those who are patient"],[2,156,"death heavy","sea","Those when afflicted with a disaster, they say, “We belong to Allah, and to Him we will return.”"],[2,157,"heavy","dunes","They are those upon whom are blessings and mercy from their Lord, and it is they who are guided"],[2,186,"alone hopeful","night","When My slaves ask you concerning Me, I am indeed near. I respond to the call of the supplicant when he calls upon Me; so they should respond to Me and believe in Me, so that they may be guided"],[2,238,"lazy","spring","Be mindful of the prayers, especially the middle prayer; and stand before Allah in complete devotion"],[2,257,"lost","light","Allah is the Protector of those who believe; He brings them out of the depths of darkness into the light. As for those who disbelieve, their protectors are false gods; they bring them out from the light into the depths of darkness. They are the people of the Fire; they will abide therein forever"],[2,261,"greed","wheat","The likeness of those who spend their wealth in the way of Allah is like a grain that sprouts seven ears, each ear bearing a hundred grains. And Allah gives multiple [rewards] for whom He wills. And Allah is All-Encompassing, All-Knowing"],[2,263,"grudge","moon","Kind words and forgiveness are better than charity followed by hurt. And Allah is Self-Sufficient, Most Forbearing"],[2,268,"greed money","mountains","Satan threatens you with poverty and orders you to commit shameful acts, but Allah promises you forgiveness and bounty from Him. And Allah is All-Encompassing, All-Knowing"],[2,274,"greed","night","Those who spend their wealth in charity, day and night, in secret and in public; they will have their reward with their Lord, and they will have no fear, nor will they grieve"],[2,277,"afraid peace","cave","Those who believe, do righteous deeds, establish prayer, and give zakah, will have their reward with their Lord; and they will have no fear, nor will they grieve"],[3,14,"lust","bees","The love of desirable things has been made appealing to people, such as women, children, hoarded heaps of gold and silver, branded fine horses, livestock, and tilled land. These are the pleasures of the life of this world, but with Allah is the best place of return"],[3,26,"money","mist","Say, “O Allah, Lord of the dominion, You give dominion to whom You will and take it away from whom You will; You honor whom You will and humiliate whom You will. All good is in Your Hand. You are Most Capable of all things"],[3,31,"guilty","dunes","Say, “If you love Allah then follow me; Allah will love you and forgive you your sins: for Allah is All-Forgiving, Most Merciful.”"],[3,38,"alone","spring","Thereupon Zachariah prayed to his Lord, saying, “My Lord, grant me by Your grace virtuous offspring, for You are the All-Hearer of prayers.”"],[3,92,"greed","peaks","You will never attain righteousness until you spend in charity from what you love. Whatever you spend, Allah is All-Knowing of it"],[3,134,"angry grudge","dew","those who spend in times of prosperity and adversity, and who restrain their anger and pardon people; for Allah loves those who do good"],[3,135,"guilty","stars","And those who, when they commit a shameful act or wrong themselves, remember Allah and seek forgiveness for their sins – who can forgive sins except Allah? – and they do not persist in what they did knowingly"],[3,139,"anxious heavy hopeful","clouds","Do not lose heart nor grieve, for you have the upper hand, if you are [truly] believers"],[3,146,"worn","path","[Imagine] how many prophets along with the devout men fought, but they did not lose heart because of what they suffered in the way of Allah, nor did they weaken nor surrender. And Allah loves those who are patient"],[3,150,"afraid","spring","But Allah is your Protector, and He is the Best of Helpers"],[3,160,"afraid anxious hopeful","hills","If Allah helps you, none can overcome you; but if He forsakes you, who is there to help you after Him? In Allah let the believers put their trust"],[3,169,"death","spring","Never think of those who are killed in Allah’s way as dead. Rather, they are alive with their Lord, receiving provision"],[3,170,"heavy peace","cave","rejoicing in what Allah has given them of His bounty, and delighted for those who have yet to join them, of those whom they left behind, that they will have no fear, nor will they grieve"],[3,173,"afraid anxious","stars","those to whom people said, “Indeed, the people have gathered against you, so fear them.” But it only increased them in faith, and they said, “Allah is Sufficient for us, and He is the best Protector.”"],[3,175,"afraid","moon","It is Satan who frightens [you] through his allies. Do not fear them, but fear Me, if you are [true] believers"],[3,185,"death","garden","Every soul will taste death, and you will be paid your reward in full on the Day of Resurrection. Whoever is spared from the Fire and admitted into Paradise has truly won, for the life of this world is nothing but an illusory pleasure"],[3,190,"doubt wonder","night","Indeed, in the creation of the heavens and earth and the alternation of the night and day are signs for people of understanding"],[3,191,"doubt wonder","dew","those who remember Allah while standing, sitting, and lying on their sides, and reflect upon the creation of the heavens and earth [saying], “Our Lord, you have not created all this in vain. Glory be to You. Protect us from the punishment of the Fire"],[3,200,"hopeful worn","path","O you who believe, be patient and endure, stand on guard and fear Allah, so that you may be successful"],[4,17,"guilty","path","Allah only accepts the repentance of those who commit evil out of ignorance, then repent soon thereafter; it is they to whom Allah will turn in forgiveness, for Allah is All-Knowing, All-Wise"],[4,27,"lust","dew","Allah wants to accept your repentance, but those who follow their lusts want you to deviate a massive deviation"],[4,32,"envy","clouds","Do not wish for what Allah has bestowed upon some of you over others. Men will have the reward of their deeds and women will have the reward of their deeds. And ask Allah for His bounty. Indeed, Allah is All-Knowing of everything"],[4,36,"parents pride","path","Worship Allah and do not associate any partners with Him. Be kind to parents, relatives, orphans, the needy, near and distant neighbors, close friends, wayfarers, and slaves whom you own. For Allah does not like those who are arrogant, boastful"],[4,40,"wronged","garden","Allah does not do injustice as much as an atom’s weight. And if it is a good deed, He will multiply it and give from Himself a great reward"],[4,78,"death","garden","Wherever you are, death will overcome you, even if you are in fortified towers.” If something good happens to them, they say, “This is from Allah,” but if something bad happens to them, they say, “This is from you.” Say, “All is from Allah.” What is wrong with these people that they hardly understand any word"],[4,103,"lazy","dew","When you have finished the prayer, remember Allah, standing, sitting, or lying down. But when you are safe again, establish regular prayer. Indeed, prayer is prescribed for the believers at specific times"],[4,110,"guilty","hills","Whoever commits evil or wrongs himself, then seeks Allah’s forgiveness will find Allah All-Forgiving, Most Merciful"],[4,114,"gossip","dunes","There is no good in much of their private talks, except for one who enjoins charity, kindness, or reconciliation between people. Anyone who does that, seeking Allah’s pleasure, We will give him a great reward"],[4,148,"wronged","bees","Allah does not like offensive words to be said in public except by one who has been wronged. Allah is All-Hearing, All-Knowing"],[4,149,"angry grudge","mountains","If you do something good openly or in secret, or pardon an offense, then Allah is indeed Ever-Pardoning, Most Capable"],[5,16,"lost","light","through which Allah guides those who seek His pleasure to the ways of peace, and brings them out of the depths of darkness to the light by His Will, and guides them to a straight path"],[5,23,"afraid","bees","Two men who feared Allah, and who had been favored by Allah said, “Enter upon them through the gate! Once you enter it, you will surely be victorious. And put your trust in Allah if you are believers.”"],[6,17,"afraid anxious","light","If Allah afflicts you with harm, there is none to remove it except Him; if He grants you good, He is Most Capable of all things"],[6,34,"heavy","river","There were messengers rejected before you, but they endured patiently their rejection and persecution until Our help came to them. None can change the words of Allah. You have already received some accounts of those messengers"],[6,59,"doubt wonder","sea","He alone has the keys of the unseen; no one knows them except Him. He knows what is in the land and sea. Not a leaf falls without His knowledge, nor a grain in the darkness of the earth, nor anything moist or dry, but is [written] in a Clear Record"],[6,82,"peace","moon","Those who believe and do not mix their faith with falsehood are the ones who will be secure, and it is they who are rightly guided"],[6,96,"wonder","moon","It is He Who cleaves the daybreak, and made the night for rest, and the sun and the moon with a precise measurement; that is the design of the All-Mighty, the All-Knowing"],[6,122,"lost","bees","Is the one who was dead and We gave him life [by faith] and gave him a light with which he walks among people like the one in darkness from which he can never escape? This is how the deeds of the disbelievers have been made appealing to them"],[6,125,"lost","mountains","Whoever Allah wills to guide, He opens his heart to Islam; and whoever He wills to lead astray, He make his heart tight and constricted, as if he were climbing up into the sky. This is how Allah punishes those who do not believe"],[6,160,"wronged","clouds","Whoever comes with a good deed will be rewarded tenfold, but whoever comes with an evil deed will only be punished with its like; and none will be wronged"],[7,10,"grateful","dew","We established you on earth and provided you with means of livelihood therein. Little do you give thanks"],[7,23,"guilty","garden","They said, “Our Lord, we have wronged ourselves; if You do not forgive us and have mercy upon us, we will surely be among the losers.”"],[7,56,"hopeful","bees","Do not spread corruption on earth after it has been set aright, but call upon Him with fear and hope. Indeed, the mercy of Allah is close to those who do good"],[7,189,"love","light","It is He Who created you from a single soul, and from it He made its spouse, so that he may find comfort in her. When he covered her, she conceived a light burden carrying it with ease. Then when she grew heavy, they called upon Allah, their Lord, “If you give us a healthy child, we will certainly be grateful.”"],[7,199,"angry grudge","birds","Be gracious, enjoin what is right and turn away from those who are ignorant"],[8,10,"anxious","river","Allah granted this only as glad tidings and to reassure your hearts, for victory only comes from Allah. Indeed, Allah is All-Mighty, All-Wise"],[8,30,"hopeful","garden","And [remember] when the disbelievers plotted against you, to take you as captive, kill you or expel you. They plan, and Allah also plans, but Allah is the Best of those who plan"],[8,46,"worn","sea","Obey Allah and His Messenger, and do not dispute with one another, or else you will lose courage and your strength will weaken. And be steadfast, for Allah is with those who are steadfast"],[8,53,"newstart","cave","This is because Allah would never change the blessings He has bestowed upon a people until they change their own attitude and conduct. Indeed, Allah is All-Hearing, All-Knowing"],[8,64,"alone","path","O Prophet, Allah is sufficient for you and for the believers who follow you"],[10,9,"lost","garden","As for those who believe and do righteous deeds, their Lord will guide them by virtue of their faith. Rivers will flow beneath them in the Gardens of Bliss"],[10,25,"peace","path","Allah invites to the Home of Peace and guides whom He wills to a straight path"],[10,57,"sick","hills","O mankind, there has come to you an exhortation from your Lord, a cure for [illness] of the hearts, a guidance and mercy for the believers"],[10,58,"grateful","mountains","Say, “By Allah’s grace and His mercy let them therefore rejoice. It is much better than what they accumulate.”"],[10,62,"afraid heavy","river","Indeed, the allies of Allah will have no fear, nor will they grieve"],[10,64,"peace","light","For them are glad tidings in the life of this world and in the Hereafter; there is no change in Allah’s words. That is the supreme triumph"],[10,107,"afraid anxious","dew","If Allah afflicts you with harm, none can remove it except Him; if He wants good for you, none can withhold His bounty. He grants it to whom He wills of His slaves, and He is the All-Forgiving, the Most Merciful.”"],[11,6,"anxious money","mist","There is no moving creature on earth but upon Allah is its provision. He knows its place of dwelling and its place of rest; everything is [written] in a clear Record"],[11,114,"lazy","night","Establish prayer at the two ends of the day and in some hours of the night. Indeed, good deeds wipe out evil deeds. This is a reminder for those who are mindful"],[12,33,"lust","hills","Joseph said, “My Lord, I would rather be in prison than that to which they are calling me. Unless you protect me from their guile, I may succumb to them and fall into ignorance.”"],[12,53,"lust","mountains","I do not absolve myself of blame. Indeed, the human soul prompts one to evil, except those to whom my Lord may show mercy. Indeed, my Lord is All-Forgiving, Most Merciful.”"],[12,64,"afraid","dew","He said, “Should I trust you with him as I trusted you earlier with his brother? But Allah is the best Protector, and He is the Most Merciful of those who show mercy.”"],[12,86,"alone heavy","moon","He said, “I only complain of my anguish and sorrow to Allah, and I know from Allah what you do not know"],[12,87,"anxious heavy hopeful","dawn","O my sons, go and find out about Joseph and his brother, and do not despair of Allah’s mercy. Indeed, no one despairs of Allah’s mercy except the disbelieving people.”"],[12,97,"guilty","light","They said, “O our father, pray to Allah to forgive us our sins; we were certainly mistaken.”"],[12,98,"guilty","peaks","He said, “I will ask my Lord to forgive you, for He is the All-Forgiving, the Most Merciful.”"],[12,110,"hopeful","mountains","Until when the messengers lost all hope and realized that they were dismissed as liars, Our help came to them, so We saved whom We willed, and Our punishment cannot be averted from the wicked people"],[13,2,"doubt wonder","moon","It is Allah Who raised the heavens without any pillars that you can see, then He rose over the Throne. He subjected the sun and the moon, each running its course for an appointed term. He governs all affairs, and explains the signs in detail, so that you may be certain of the meeting with your Lord"],[13,3,"wonder","garden","It is He Who spread out the earth and placed therein firm mountains and rivers, and created therein fruits of every kind in pairs. He causes the night to cover the day. Indeed, there are signs in this for people who reflect"],[13,28,"anxious peace","dew","those who believe and whose hearts find tranquility in the remembrance of Allah, for indeed in the remembrance of Allah do hearts find tranquility"],[14,7,"grateful hopeful","clouds","And [remember] when your Lord declared, ‘If you are grateful, I will surely give you more; but if you are ungrateful, My punishment is severe indeed.’”"],[14,12,"anxious","sea","Why should we not put our trust in Allah, and it is He Who has guided us to our ways? We will surely be patient against whatever harm you cause us. And in Allah let the faithful put their trust.”"],[14,34,"grateful","garden","And He gave you of all that you have asked for. If you try to count the blessings of Allah, you cannot count them. Indeed, mankind is truly unjust and ungrateful"],[14,41,"parents","stars","Our Lord, forgive me, my parents, and the believers on the Day when the reckoning will take place.”"],[14,42,"wronged","night","Never think that Allah is unaware of what the wrongdoers do; He only delays them for a Day when eyes will stare [in horror] –"],[15,22,"wonder","rain","And We send fertilizing winds, and send down rain from the sky for you to drink, and it is not you who could store it"],[15,49,"guilty","night","Inform My slaves that I am indeed the All-Forgiving, the Most Merciful"],[15,85,"angry","dew","We have not created the heavens and earth and all that is between them except for a true purpose. The Hour is certainly coming, so bear with them graciously"],[15,88,"envy","moon","Do not look longingly at the pleasures We have given certain classes of them, nor grieve over them, but lower your wing [in humility] to the believers"],[16,5,"wonder","cattle","And He has created the livestock for you as a source of warmth and other benefits, and from them you eat"],[16,6,"wonder","path","There is beauty for you in them when you bring them home to rest and when you take them out to graze"],[16,8,"wonder","dunes","And horses, mules and donkeys for you to ride and for adornment, and He creates other things that you do not know"],[16,9,"lost","path","It is upon Allah to show the straight path, while other ways are deviant. If He had willed, He could have guided you all"],[16,10,"wonder","rain","It is He Who sends down rain from the sky, from it you drink, and by it plants thrive on which you pasture your livestock"],[16,11,"wonder","palms","He causes to grow therewith crops, olives, palm trees, grapevines and all kinds of fruits for you. Indeed, there is a sign in this for people who reflect"],[16,13,"wonder","spring","And He has created for you various kinds of things on earth. Indeed, there are signs in this for people who take heed"],[16,14,"grateful","ship","It is He Who has subjected the sea, so that you may eat from it tender meat and extract ornaments to wear. And you see the ships cleaving their way through its waves, so that you may seek His bounty and so that you may give thanks"],[16,15,"wonder","river","And He has placed into the earth firm mountains, so it does not tremor with you, and there are rivers and pathways so that you may find your way"],[16,18,"grateful","night","If you try to count Allah’s favors, you will not be able to enumerate them. Indeed, Allah is All-Forgiving, Most Merciful"],[16,23,"pride","hills","Undoubtedly, Allah knows what they conceal and what they reveal. Indeed, He does not like those who are arrogant"],[16,41,"wronged","mist","Those who migrated for the sake of Allah after being oppressed, We will surely give them good in this world. But the reward of the Hereafter is greater, if only they knew"],[16,53,"grateful","birds","Whatever blessing you have, it is from Allah. Then when you are afflicted with hardship, to Him alone you cry out for help"],[16,65,"wonder","rain","Allah sends down rain from the sky and revive thereby the earth after its death. Indeed, there is a sign in this for people who listen"],[16,66,"wonder","cattle","And there is surely a lesson for you in livestock. We give you drink from what is in their bellies – produced between excretion and blood – pure and pleasant milk for those who drink"],[16,68,"wonder","bees","Your Lord inspired the bees, “Make homes in the mountains, the trees, and in the trellises that people put up"],[16,69,"sick wonder","garden","Then feed on every kind of fruit and follow the ways that your Lord made easy for you.” There comes out from their bellies a drink of various colors, in which there is healing for people. Indeed, there is a sign in this for people who reflect"],[16,71,"envy","cave","Allah has favored some of you over others in provision. Those who are favored will not share their provision with their slaves, so that they may become equal to them. Do they then deny the favors of Allah"],[16,78,"grateful","clouds","Allah brought you out from your mothers’ wombs not knowing anything, and He gave you hearing, sight and intellect, so that you may be grateful"],[16,79,"wonder","birds","Do they not see the birds enabled to fly in the open air? None holds them up except Allah. Indeed, there are signs in this for people who believe"],[16,80,"grateful","cattle","Allah has made your houses a place of rest for you, and He has given you tents made from the hides of livestock which you find light to handle when you travel and when you camp. And out of their wool, fur and hair [He has given you] furnishings and enjoyment for a while"],[16,97,"peace","clouds","Whoever does righteous deeds, male or female, while being a believer, We will surely grant him a good life, and We will surely reward them according to the best of their deeds"],[16,127,"heavy worn","spring","And be patient, for your patience comes only from Allah; do not grieve over them, nor be distressed by their evil plots"],[17,23,"parents peace","dew","Your Lord has ordained that you worship none but Him, and show kindness to parents. If one or both of them reach old age in your care, do not say to them a word of annoyance nor scold them, rather speak to them noble words"],[17,24,"parents","stars","and lower to them the wing of humility out of mercy, and say, “My Lord, have mercy upon them as they raised me when I was small.”"],[17,30,"money","hills","Your Lord extends provision to whom He wills or restricts it. He is All-Aware and All-Seeing of His slaves"],[17,32,"lust","path","Do not go near adultery, for it is indeed a shameful act and an evil way"],[17,36,"gossip","garden","Do not follow that of which you have no knowledge. Indeed, the hearing, the sight, and the heart, all of them will be called to account"],[17,37,"pride","mountains","Do not walk on the earth arrogantly; you cannot cleave the earth, nor can you reach the mountains in height"],[17,44,"wonder","night","The seven heavens and the earth, and all those in them glorify Him. There is not a single thing that does not glorify Him with His praise, but you do not understand their glorification. Indeed, He is Most Forbearing, All-Forgiving"],[17,70,"grateful","sea","We have honored the children of Adam, carried them on land and sea, provided for them good things and favored them above many of those whom We have created"],[17,78,"lazy","sun","Establish prayer at the decline of the sun until the darkness of the night, and the recitation of dawn [prayer], for the recitation of dawn is ever witnessed [by the angles]"],[17,80,"lost newstart","dew","And say, “My Lord, make me enter an honorable entrance and make me exit an honorable exit, and grant me from Yourself a supporting authority.”"],[17,82,"sick","night","We send down the Qur’an as a healing and mercy for the believers, but it does not increase the wrongdoers except in loss"],[18,10,"lost","cave","When the youths took refuge in the Cave, and said, “Our Lord, grant us mercy from Yourself, and show us the right way in our ordeal.”"],[19,4,"alone","bees","He said, “My Lord, my bones have grown feeble, and gray hair has spread across my head, yet never have I been disappointed in my prayer to You, my Lord"],[19,14,"parents","peaks","and dutiful to his parents, and he was not an oppressor or disobedient"],[19,32,"parents","light","and has made me dutiful to my mother, and has not made me an oppressor or disobedient"],[19,96,"love","night","Those who believe and do righteous deeds, the Most Compassionate will endear them [to His creation]"],[20,2,"worn","peaks","We have not sent down the Qur’an to you [O Prophet] to cause you distress"],[20,14,"lazy","mountains","‘Indeed, I am Allah; none has the right to be worshiped except Me, so worship Me and establish prayer to remember me"],[20,46,"afraid alone anxious","night","He said, “Do not be afraid; I am with you both, hearing and seeing"],[20,68,"afraid","clouds","We said, “Do not be afraid; it is you who will prevail"],[20,82,"guilty","dew","I am indeed Most Forgiving to those who repent and believe, and do righteous deeds, then stay on the right path.”"],[20,131,"envy","dunes","Do not turn your eyes covetously towards the various forms of splendor of this life that We have given some of the [disbelievers] to enjoy, as a trial for them. But the provision of your Lord is far better and more lasting"],[20,132,"lazy worn","river","Enjoin your household to perform prayer and adhere to it firmly. We ask no provision from you; rather, it is We Who give you provision. And the best outcome is for those who fear Allah"],[21,33,"wonder","moon","It is He Who created the night and the day, the sun and the moon – each floating in its orbit"],[21,35,"death","moon","Every soul will taste death; We test you with bad and good as a trial, then to Us you will all be returned"],[21,47,"wronged","wheat","We will place the scales of justice on the Day of Resurrection, and no soul will be wronged in the least. Even if a deed is the weight of a mustard seed, We will bring it forth. Sufficient are We as Reckoners"],[21,83,"heavy sick","bees","And [remember] Job, when he cried out to his Lord, “I have been struck by adversity, and You are the Most Merciful of those who show mercy.”"],[21,84,"sick","light","So We responded to him and relieved his adversity, and We restored to him his family, twice as many, as a mercy from Us and as a reminder for Our worshipers"],[21,87,"guilty","light","And [remember] the Man of the Whale [Jonah] when he departed in anger, thinking that We would not take him to task. Then he cried out in the depths of darkness, “None has the right to be worshiped except You. Glory be to You! I have certainly done wrong”"],[21,88,"heavy hopeful","birds","So We answered his prayer and rescued him from distress. This is how We rescue the believers"],[21,89,"alone","dew","And [remember] Zachariah, when he cried out to his Lord, “My Lord, do not leave me childless, for You are the Best of Inheritors.”"],[23,1,"lazy","river","The believers have attained true success"],[23,2,"lazy","garden","those who humble themselves in their prayers"],[23,3,"gossip","light","and those who turn away from all that is vain"],[23,5,"lust","spring","and those who guard their sexual desires"],[23,18,"wonder","rain","We send down water from the sky in due measure and cause it to stay in the earth, and We are surely able to take it away"],[23,19,"wonder","palms","With this [water] We produce for you gardens of palm trees and grapevines, in which there are many fruits from which you eat"],[23,96,"angry","spring","Repel evil with what is best; We know well what they claim"],[23,118,"guilty","peaks","Say, “My Lord, forgive and have mercy, and you are the Best of those who show mercy.”"],[24,15,"gossip","dew","when you were passing it from one tongue to the other, and saying with your mouths what you had no knowledge of, and were taking it lightly, whereas with Allah it was a grave offense"],[24,21,"lust","bees","O you who believe, do not follow the footsteps of Satan; whoever follows the footsteps of Satan, he only enjoins indecency and evil acts. Were it not for Allah’s grace and mercy upon you, none of you would have ever been purified. But Allah purifies whom He wills, and Allah is All-Hearing, All-Knowing"],[24,22,"angry grudge guilty","hills","The people of virtue and affluence among you should not swear to withhold their aid from their relatives, the needy and the emigrants in the cause of Allah. Let them pardon and overlook. Do you not like to be forgiven by Allah? For Allah is All-Forgiving, Most Merciful"],[24,30,"lust","peaks","Tell the believing men to lower their gazes and guard their private parts; that is purer for them. Indeed, Allah is All-Aware of what they do"],[24,32,"love","cave","Arrange marriages for those of you who are unmarried, and for the righteous of your bondmen and bondwomen. If they are poor, Allah will suffice them from His bounty, for Allah is All-Bountiful, All-Knowing"],[25,20,"worn","cave","We did not send any messengers before you [O Prophet] except that they ate food and walked in the markets. We have made some of you as a trial for others. Will you have patience? For your Lord is All-Seeing"],[25,45,"wonder","sun","Do you not see how your Lord extends the shade? If He had willed, He could have made it still. Then We made the sun an indication for it"],[25,47,"wonder","night","It is He Who has made the night as a garment for you, and made sleep for rest; and has made daytime for returning to life"],[25,48,"wonder","sandwind","It is He Who sends the winds as harbingers before His mercy, and We send down from the sky pure water"],[25,53,"wonder","river","It is He Who merges the two bodies of water: one fresh and palatable and the other salty and bitter, and He has made between them a barrier and an insurmountable partition"],[25,54,"wonder","garden","It is He Who created human beings from water, then made between them bonds of kinship and marriage, for your Lord is Most Capable"],[25,58,"afraid anxious","cave","Put your trust in the Ever-Living Who never dies, and glorify Him with praise. He is Sufficient as All-Aware of the sins of His slaves –"],[25,61,"wonder","stars","Blessed is He Who placed in the sky constellations, and placed therein a radiant lamp and a luminous moon"],[25,63,"angry peace pride","moon","The slaves of the Most Compassionate are those who walk on earth humbly, and when the ignorant address them, they only say words of peace"],[25,70,"guilty newstart","sea","except those who repent and believe, and do righteous deeds; for them Allah will change their evil deeds into good deeds, for Allah is All-Forgiving, Most Merciful"],[25,72,"angry gossip","river","And those who do not witness falsehood, and when they pass by futility, they pass by with dignity"],[25,74,"love peace","light","and those who say, “Our Lord, let our spouses and children be a source of joy for us, and make us good examples for the righteous.”"],[26,62,"afraid alone","light","Moses said, “Certainly not! My Lord is with me; He will guide me.”"],[26,80,"sick","garden","and when I am ill He heals me"],[27,19,"grateful","night","So he smiled in amusement at her words and said, “My Lord, inspire me to be grateful for Your favor which You have bestowed upon me and my parents, and to do righteous deeds that please you. And admit me, by Your mercy, among Your righteous slaves.”"],[27,60,"wonder","rain","Is He [not better] Who created the heavens and earth, and sent down for you rain from the sky, by which We caused to grow gardens of cheerful beauty? You could never cause their trees to grow. Is there any god besides Allah? No, but they are people who ascribe equals [to Allah]"],[27,61,"wonder","twoseas","Is He [not better] Who made the earth a stable place to live, and caused rivers to flow through it, and placed therein firm mountains, and made a barrier between two flowing bodies of water? Is there any god besides Allah? No, but most of them do not know"],[27,79,"afraid","clouds","So put your trust in Allah, for you are upon the clear truth"],[28,7,"heavy","night","We inspired the mother of Moses, “Suckle him; but when you fear for him, cast him into the river, and do not fear or grieve. We will surely return him to you, and will make him one of the messengers.”"],[28,54,"angry","dunes","They will be given their reward twice for their patience, repelling evil with good, and for spending out of what We have provided for them"],[28,80,"envy","birds","But those who were given knowledge said, “Woe to you! Allah’s reward is better for those who believe and do righteous deeds. But none will attain this except those who are steadfast.”"],[28,83,"pride","night","That is the abode of the Hereafter We will assign to those who neither seek superiority nor corruption on earth. The best outcome is for those who fear Allah"],[29,8,"parents","peaks","We have enjoined upon man kindness to his parents. But if they strive to make you associate with Me what you have no knowledge of, then do not obey them. To Me is your return; then I will inform you of what you used to do"],[29,20,"doubt wonder","path","Say, “Travel through the land and see how He originated the creation, then Allah will repeat it a second time. Indeed, Allah is Most Capable of all things.”"],[29,45,"lazy","light","Recite [O Prophet] what is revealed to you of the Book, and establish prayer, for indeed prayer restrains one from immoral acts and wickedness. Indeed, the remembrance of Allah is of greater merit. And Allah knows all what you do"],[29,57,"death","hills","Every soul will taste death, then to Us you will all be returned"],[29,60,"anxious money","sea","How many creatures there are that cannot carry their provisions! It is Allah Who provides for them and for you, and He is the All-Hearing, the All-Knowing"],[29,69,"alone hopeful lost","dew","As for those who strive in Our cause, We will surely guide them to Our ways, for Allah is certainly with those who do good"],[30,8,"doubt","mountains","Do they not reflect on themselves? Allah did not create the heavens and earth and all that is between them except for a true purpose and for an appointed term, but most people deny the meeting with their Lord"],[30,21,"love peace","night","And among His signs is that He created for you spouses from among yourselves that you may find comfort in them, and He placed between you love and mercy. Indeed, there are signs in this for people who reflect"],[30,22,"wonder","moon","And among His signs is the creation of the heavens and earth, and the diversity of your tongues and colors. Indeed, there are signs in this for those who have knowledge"],[30,23,"wonder","night","And among His signs is your sleep by night and day, and your seeking of His bounty [by day]. Indeed, there are signs in this for people who listen"],[30,24,"wonder","lightning","And among His signs is that He shows you lightning, causing fear and hope, and He sends down water from the sky, reviving therewith the earth after its death. Indeed, there are signs in this for people who understand"],[30,37,"money","birds","Do they not see that Allah extends provision to whom He wills or restricts it? Indeed, there are signs in this for people who believe"],[30,46,"grateful","ship","Among His signs is that He sends the winds as harbingers [of rain], so that He may give you a taste of His mercy, and that the ships may sail by His command, and that you may seek His bounty, and so that you may be grateful"],[30,48,"wonder","rain","It is Allah Who sends the winds that stir up clouds, then He spreads them in the sky as He wills, and He splits them into different fragments, then you see the rain pouring down from their midst. Then as soon as He makes it fall upon whoever He wills of His slaves, they rejoice"],[31,10,"wonder","rain","He created the heavens without pillars that you can see; and He placed firm mountains on the earth so it does not shake with you; and He spread therein all kinds of creatures. We sent down rain from the sky and caused to grow therein all kinds of fine plants"],[31,14,"parents","hills","We have enjoined upon man kindness to his parents. His mother bore him in weakness upon weakness, and his weaning took place within two years. Be grateful to Me and to your parents. To Me is the final return"],[31,17,"worn","sea","“O my dear son, establish prayer, enjoin what is right and forbid what is wrong, and be patient with whatever befalls you. This is a matter of firm resolve"],[31,18,"peace pride","dunes","Do not turn your face away from people [in contempt], and do not walk on earth in arrogance. Indeed, Allah does not like anyone who is arrogant and boastful"],[31,19,"angry gossip","river","Be moderate in your gait and lower your voice. Indeed, the most repugnant of voices is the voice of donkeys.”"],[31,20,"grateful","garden","Do you not see that Allah has made subservient to you all that is in the heavens and on earth, and has abundantly bestowed upon you His favors, both apparent and hidden? Yet there are some people who dispute concerning Allah without knowledge, or guidance, or an enlightening scripture"],[31,27,"wonder","sea","If all the trees on earth were pens and the ocean [were ink], replenished by seven more oceans, the Words of Allah would not be exhausted. Indeed, Allah is All-Mighty, All-Wise"],[31,29,"wonder","moon","Do you not see that Allah causes the night to merge into day and the day into the night, and has subjected the sun and the moon, each running its course for an appointed term, and that Allah is All-Aware of what you do"],[31,34,"death","rain","Indeed, Allah has the knowledge of the Hour. He sends down the rain and knows what is in the wombs. No soul knows what it will do tomorrow, nor does any soul know in which land it will die. Indeed, Allah is All-Knowing, All-Aware"],[32,27,"wonder","cattle","Do they not see that We drive water to parched land, producing thereby crops of which their cattle and they themselves eat? Do they not then see"],[33,3,"anxious","stars","Put your trust in Allah; sufficient is Allah as a Disposer of Affairs"],[33,39,"afraid","birds","those who convey the messages of Allah and fear Him, and they do not fear anyone except Allah. And sufficient is Allah as a Reckoner"],[33,44,"peace","dawn","Their greeting on the Day they meet Him will be, “Peace,” and He has prepared for them a generous reward"],[33,47,"hopeful","hills","And give glad tidings to the believers that they will have a great bounty from Allah"],[33,70,"gossip","dunes","O you who believe, fear Allah and say what is right"],[34,39,"greed money","dunes","Say, “My Lord extends provision to whom He wills of His slaves or restricts it. Whatever you spend in charity, He will compensate for it, for He is the Best of Providers.”"],[35,2,"anxious","clouds","Whatever mercy Allah opens up for people, none can withhold it; and whatever He withholds, none can release it thereafter, for He is the All-Mighty, All-Wise"],[35,9,"wonder","clouds","It is Allah Who sends the winds which stir up clouds, then We drive them to a dead land, and revive therewith the earth after its death. Such will be the Resurrection"],[35,12,"wonder","ship","The two bodies of water are not alike: one is fresh and palatable, pleasant to drink, and the other is salty and bitter. Yet from each you eat fresh meat and extract ornaments to wear. And you see the ships traverse their way through both, so that you may seek His bounty and so that you may give thanks"],[35,27,"wonder","rain","Do you not see that Allah sends down rain from the sky, then We bring forth thereby fruits of various colors? And in the mountains there are various tracts of white and red, of various colors, and raven black"],[35,34,"heavy","birds","And they will say, “All praise be to Allah Who has taken away from us all sorrow. Indeed, our Lord is All-Forgiving, Most Appreciative"],[36,33,"wonder","wheat","There is a sign for them in the dead land: We give it life and produce from it grain for them to eat"],[36,35,"grateful","garden","so that they may eat of its fruit that was not made by their hands. Will they not then give thanks"],[36,36,"wonder","garden","Glory be to the One Who created all types of things that the earth produces, and of themselves, and of things that they have no knowledge about"],[36,37,"wonder","night","There is another sign for them in the night: We strip from it the daylight, and they are left in darkness"],[36,38,"wonder","sun","The sun is running to its determined course. That is the design of the All-Mighty, All-Knowing"],[36,39,"wonder","palms","As for the moon, We have determined phases for it, until it becomes like an old palm stalk"],[36,40,"wonder","moon","It is not for the sun to catch up with the moon, nor for the night to outstrip the day. Each is floating in its own orbit"],[36,58,"peace","spring","“Peace”: a word from a Most Merciful Lord"],[38,35,"guilty","cave","He said, “My Lord, forgive me and grant me a kingdom, the like of which will never be granted to anyone after me. You are indeed the Bestower.”"],[39,5,"wonder","moon","He created the heavens and earth for a true purpose. He wraps the night over the day and wraps the day over the night. He has subjected the sun and the moon, each running its course for an appointed term. Indeed, He is the All-Mighty, Most Forgiving"],[39,10,"hopeful worn","dawn","Say, “O My slaves who believe, fear your Lord. Those who do good in this world will have a good return, and Allah’s earth is spacious. Those who observe patience will be given their reward without measure.”"],[39,18,"lost","river","those who listen to what is said and follow the best of it. They are the ones whom Allah has guided, and they are the people of understanding"],[39,21,"wonder","rain","Do you not see that Allah sends down rain from the sky and makes it flow as springs in the earth, then He brings forth thereby crops of various colors; then they whither and you see them turn yellow; then He causes them to crumble? Indeed, there is a reminder in this for people of understanding"],[39,22,"peace","spring","Is one whose heart Allah has opened to Islam, so he is enlightened by his Lord [like a disbeliever]? Woe to those whose hearts are hardened upon hearing the reminder of Allah; it is they who are clearly misguided"],[39,36,"afraid anxious","dunes","Is Allah not sufficient for His slave? Yet they frighten you with those [whom they worship] besides Him. Whoever Allah causes to stray, there is none to guide him"],[39,42,"death","cave","Allah takes away the souls at the time of their death and of those who do not die during their sleep. He withholds the souls of those on whom He has decreed death, and releases others until an appointed term. Indeed, there are signs in this for people who reflect"],[39,53,"guilty heavy hopeful newstart","path","Say [Allah says], “O My slaves who have transgressed against themselves, do not despair of Allah’s mercy, for indeed Allah forgives all sins. He is indeed the All-Forgiving, the Most Merciful"],[39,54,"guilty","sea","Turn to your Lord [in repentance] and submit to Him before the punishment comes upon you, for then you will not be helped"],[39,66,"grateful","moon","Rather, worship Allah alone and be among those who are grateful"],[39,73,"peace","spring","But those who feared their Lord will be led to Paradise in groups, until when they reach it, its gates will be wide open, and its keepers will say to them, “Peace be upon you. You have done well, so enter it, abiding forever.”"],[40,19,"lust","mist","He knows the sneaky glances of the eyes and what the hearts conceal"],[40,51,"wronged","dew","We will surely help Our messengers and those who believe in the life of this world and on the Day when the witnesses will come forward"],[40,60,"alone hopeful","path","Your Lord says, “Call upon Me; I will respond to you. Those who are too proud to worship Me will enter Hell, utterly debased.”"],[40,61,"grateful","night","It is Allah Who has made the night for you to rest therein and the day bright. Indeed, Allah is Most Bountiful to people, but most people are ungrateful"],[41,30,"afraid anxious","sea","Those who say, “Our Lord is Allah,” then remain steadfast, the angels will descend upon them [at the time of death, saying], “Do not fear, nor grieve, but receive glad tidings of Paradise which you were promised"],[41,31,"peace","dunes","We are your allies in the life of this world and in the Hereafter. You will have therein whatever your souls desire, and you will have therein whatever you ask for"],[41,34,"angry grudge","light","Good and evil are not equal. Repel evil with what is good; the one whom you have enmity with will become as if he was a close friend"],[41,35,"angry worn","peaks","But none can attain this except those who are patient, and none can attain this except those who are greatly fortunate"],[41,37,"wonder","moon","Among His signs are the night and the day, the sun and the moon. Do not prostrate to the sun or to the moon, but prostrate to Allah Who created them, if you truly worship Him"],[41,39,"wonder","rain","And among His signs is that you see the land withered, but when We send down rain upon it, it stirs and swells. He Who gives it life will surely give life to the dead, for He is Most Capable of all things"],[41,53,"doubt wonder","light","We will show them Our signs in the universe and in their own selves, until it becomes clear to them that this [Qur’an] is the truth. Is it not enough that your Lord is a Witness over all things"],[42,19,"anxious money","dunes","Allah is Kind to His slaves; He gives provision to whom He wills, and He is the All-Powerful, the All-Mighty"],[42,25,"guilty","cave","It is He Who accepts repentance from His slaves and pardons sins, and He knows all what you do"],[42,29,"wonder","night","Among His signs is the creation of the heavens and earth, and what He spread between them of all living creatures. And He is Most Capable of bringing them together whenever He wills"],[42,30,"guilty","moon","Whatever calamity befalls you is because of what your own hands have earned, and He overlooks much"],[42,37,"angry","sea","and those who avoid major sins and shameful deeds, and when they are angered, they forgive"],[42,39,"wronged","river","and those who retaliate fairly when oppressed"],[42,40,"grudge","garden","The retribution of harm is its equivalent harm, but whoever pardons and seeks reconciliation, his reward is with Allah. Indeed, He does not like the wrongdoers"],[42,41,"wronged","light","But whoever retaliates after being wronged, there is no blame on them"],[42,43,"angry grudge worn","spring","But whoever observes patience and forgives, it is indeed a matter of great resolve"],[42,52,"lost","light","Likewise We have revealed to you a revelation by Our command. You knew nothing of the Scripture or matters of faith, but We have made it [the Qur’an] a light by which We guide whom We will of Our slaves. And you are truly leading people to a straight path"],[43,11,"wonder","rain","And it is He Who sends down rain from the sky in due measure, by which We revive dead land. This is how you will be brought forth [from the grave]"],[43,32,"envy","cave","Is it they who distribute the mercy of your Lord? It is We Who have distributed their livelihood among them in the life of this world, and have raised some of them above others in ranks, so that they may serve one another. But the mercy of your Lord is better than what they accumulate"],[45,5,"wonder","sandwind","And in the alternation of the night and day, the provision that Allah sends down from the sky, reviving thereby the earth after its death, and directing of the winds, there are signs for people of understanding"],[45,12,"grateful","ship","It is Allah Who has subjected for you the sea, so that the ships may sail on it by His command, and so that you may seek His bounty, and so that you may be grateful"],[45,14,"grudge","dawn","Tell those who believe to forgive those who do not fear the days of Allah, so that He may recompense each people for what they used to do"],[46,13,"peace","peaks","Indeed, those who say, “Our Lord is Allah”, then remain steadfast, they will have no fear, nor will they grieve"],[46,31,"guilty","light","O our people, respond to the one who is calling to Allah, and believe in him; He will forgive some of your sins and protect you from a painful punishment"],[46,35,"worn","birds","So be patient, as the Messengers of Firm Resolve were patient, and do not seek to hasten [punishment] for them. On the Day when they see what they were warned of, it will be as if they had only stayed [in this world] for an hour of a day. This is a warning. Will anyone be destroyed except the rebellious people"],[47,7,"anxious hopeful","night","O you who believe, if you stand up for Allah, He will help you and make your steps firm"],[47,17,"lost","river","As for those follow guidance, He increases them in guidance and blesses them with righteousness"],[47,24,"doubt","dew","Do they not reflect upon the Qur’an, or are there locks upon their hearts"],[48,4,"peace","dew","It is He Who sent down tranquility into the hearts of the believers so that they may increase in faith along with their faith. To Allah belong the soldiers of the heavens and earth. And Allah is All-Knowing, All-Wise"],[49,10,"love","sea","The believers are but brothers, so make peace between your brothers. And fear Allah, so that you may be shown mercy"],[49,12,"gossip","river","O you who believe, avoid much of the suspicion, for some suspicions are sin. Do not spy on one another, nor backbite one another. Would any of you like to eat the flesh of his dead brother? You would surely abhor it. So fear Allah. Indeed, Allah is Accepting of Repentance, Most Merciful"],[49,13,"peace","garden","O mankind, We have created you from a male and a female, and made you into nations and tribes so that you may recognize one another. Indeed, the most noble of you before Allah is the most righteous among you. Indeed, Allah is All-Knowing, All-Aware"],[50,6,"wonder","stars","Have they not then looked at the sky above them – how We built it and adorned it [with stars], and it has no rifts"],[50,7,"wonder","mountains","And We have spread out the earth and set therein firm mountains, and caused to grow therein plants of every pleasant kind"],[50,9,"wonder","rain","And We send down from the sky blessed rain, with which We cause to grow gardens and grain for harvest"],[50,10,"wonder","palms","and towering palm trees having clustered fruit"],[50,16,"alone","path","We have created man and know what his soul whispers within him, for We are closer to him than his jugular vein"],[50,18,"gossip","dunes","Not a single word he utters but there is with him a vigilant watcher, ready [to record it]"],[50,34,"peace","mountains","Enter it in peace. This is the Day of eternity.”"],[51,20,"doubt wonder","mist","On earth there are signs for those who are certain in faith"],[51,21,"doubt wonder","hills","and also in your own selves. Do you not see"],[51,22,"anxious money","mountains","And in the heaven is your provision and all that you are promised"],[51,47,"wonder","light","We built the heaven with might, and We are indeed expanding it"],[51,48,"wonder","spring","And We spread out the earth. How well did We smooth it out"],[51,49,"wonder","spring","And We have created everything in pairs, so that you may take heed"],[51,56,"lazy","dawn","I have not created the jinn and mankind except to worship Me"],[53,49,"wonder","stars","and that He is the Lord of Sirius [a star worshiped before Islam]"],[54,49,"wonder","light","Indeed, We have created everything according to a determined measure"],[55,13,"grateful","path","Then which of the favors of your Lord will you [men and jinn] deny"],[55,19,"wonder","twoseas","He merges the two seas [of fresh and salty water] meeting together"],[55,20,"wonder","spring","yet between them is a barrier so that they do not cross"],[56,26,"peace","peaks","except the words of peace, peace"],[56,63,"wonder","light","Have you thought about what you sow"],[56,68,"wonder","dew","Have you thought about the water that you drink"],[56,71,"wonder","moon","Have you thought about the fire that you kindle"],[57,4,"alone","clouds","It is He Who created the heavens and earth in six days, and then rose over the Throne. He knows all that goes into the earth and all that comes out of it, and all that descends from the heaven and all that ascends to it. He is with you wherever you are, and Allah is All-Seeing of what you do"],[57,6,"wonder","night","He causes the night to merge into the day and the day to merge into the night, and He is All-Knowing of what is in the hearts"],[57,7,"greed","mountains","Believe in Allah and His Messenger, and spend [in Allah’s cause] out of what He has entrusted you with. For those among you who believe and spend, there will be a great reward"],[57,23,"envy heavy pride","clouds","so that you may not grieve over what you have missed, nor exult over what He has given you, for Allah does not love anyone who is conceited and boastful –"],[59,10,"grudge","spring","And those who came after them say, “Our Lord, forgive us and our brethren who preceded us in faith, and do not let there be any ill feelings in our hearts towards those who believe. Our Lord, indeed, You are All-Gracious, Most Merciful.”"],[59,23,"peace","sea","He is Allah; none has the right to be worshiped except Him, the Sovereign, the Most Holy, the Most Perfect, the Granter of Security, the Watcher over all, the All-Mighty, the Compeller, the Supreme. Glory be to Allah far above what they associate with Him"],[60,7,"love","mist","It may be that Allah will bring about friendship between you and those of them whom you hold as enemies. Allah is Most Capable, and Allah is All-Forgiving, Most Merciful"],[62,8,"death","river","Say, “The death from which you run away will surely overcome you, then you will be brought back to the Knower of the unseen and the seen, and He will inform you of what you used to do.”"],[62,9,"lazy","garden","O you who believe, when the call for prayer is made on Friday, then hasten to the remembrance of Allah and leave off trading. That is better for you, if only you knew"],[62,10,"money","light","When the prayer is over, disperse in the land and seek from the bounty of Allah, and remember Allah much so that you may be successful"],[63,9,"greed","mist","O you who believe, do not let your wealth and your children distract you from Allah’s remembrance. For whoever does that, it is they who are the losers"],[64,11,"lost","stars","No calamity befalls except with Allah’s permission. Whoever believes in Allah, He will guide his heart. And Allah is All-Knowing of everything"],[64,16,"greed","mist","So fear Allah as much as you can, listen and obey, and spend in charity; that is better for your souls. Whoever is protected from the stinginess of his soul, it is they who are successful"],[65,3,"afraid anxious hopeful money","clouds","and He will provide for him from where he does not expect. Whoever puts his trust in Allah, He is sufficient for him. Indeed, Allah will surely accomplish His purpose, for Allah has set a destiny for everything"],[67,3,"wonder","sea","Who created seven heavens one above another; you will not see any imperfection in the creation of the Most Compassionate. Look again; can you see any flaw"],[67,15,"anxious money","path","It is He Who made the earth smooth for you, so travel through its regions and eat from His provisions. And to Him is the resurrection"],[67,19,"doubt wonder","birds","Do they not see the birds above them, spreading out and folding in their wings? None holds them up except the Most Compassionate. He is indeed All-Seeing of everything"],[67,23,"grateful","dunes","Say, “It is He Who brought you into being and gave you hearing, sight, and hearts; little do you give thanks.”"],[70,29,"lust","peaks","and those who guard their private parts"],[71,10,"guilty","mountains","I said, ‘Seek forgiveness from your Lord. Indeed, He is Most Forgiving"],[71,15,"wonder","garden","Do you not see how Allah has created seven heavens, one above another"],[71,16,"wonder","moon","and has placed the moon therein as a light and the sun as a burning lamp"],[71,28,"parents","hills","My Lord, forgive me and my parents, and whoever enters my house as a believer, and all the believing men and women, and do not increase the wrongdoers except in ruin.”"],[76,3,"grateful lost","path","Indeed, We showed him the way, whether he is grateful or ungrateful"],[76,9,"peace","sea","[saying to themselves] “We feed you only for the sake of Allah; we seek from you neither reward nor gratitude"],[76,24,"worn","mist","So be patient with your Lord’s decree, and do not obey any sinner or disbeliever from among them"],[78,6,"wonder","river","Have We not made the earth a resting place"],[78,7,"wonder","mountains","And the mountains as stakes"],[78,9,"wonder","peaks","and made your sleep for rest"],[78,10,"wonder","night","and made the night a covering"],[78,11,"wonder","cave","and made the day for seeking livelihood"],[78,12,"wonder","birds","and built above you seven mighty heavens"],[78,13,"wonder","lamp","and made therein a blazing lamp"],[78,14,"wonder","rain","and sent down from the rainclouds abundant water"],[79,40,"lust","stars","But those who feared standing before their Lord and restrained themselves from evil desires"],[87,14,"
