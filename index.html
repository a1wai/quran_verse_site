lazy","light","Indeed, he who purifies himself will attain success"],[87,15,"lazy","peaks","and remembers his Lord’s Name and prays"],[88,17,"doubt wonder","cattle","Do they not reflect on the camel, how it is created"],[88,18,"wonder","dunes","and the sky, how it is raised high"],[88,19,"wonder","mountains","and the mountains, how they are firmly set up"],[88,20,"wonder","garden","and the earth, how it is spread out"],[89,27,"death peace","dew","[It will be said to the believer,] “O the tranquil soul"],[89,28,"death peace","spring","Return to your Lord, well pleased and pleasing [to Him]"],[89,29,"peace","peaks","Join My [righteous] slaves"],[89,30,"peace","spring","and enter My Paradise.”"],[90,10,"lost","mountains","and shown him the two ways [of right and wrong]"],[90,17,"worn","peaks","then [most importantly] to be one of those who believe and exhort one another to patience and exhort one another to compassion"],[91,1,"wonder","sun","By the sun and its brightness"],[91,2,"wonder","moon","and by the moon as it follows it"],[91,3,"wonder","garden","and by the day as it displays it"],[91,4,"wonder","night","and by the night as it covers it"],[92,7,"hopeful newstart worn","path","We will make easy for him the way of salvation"],[92,18,"greed","night","who spends his wealth to purify himself"],[92,21,"peace","spring","He will surely be well pleased"],[93,3,"alone heavy","birds","your Lord has not forsaken you [O Prophet], nor does He hate you"],[93,4,"hopeful","dew","the Hereafter is better for you than the present life"],[93,5,"heavy hopeful","spring","and your Lord will certainly give you so much that you will be well pleased"],[93,6,"heavy","night","Did He not find you an orphan then take good care of you"],[93,7,"heavy lost","moon","Did He not find you unguided then guide you"],[93,8,"heavy","dawn","Did He not find you in need then enrich you"],[93,11,"grateful","hills","and proclaim the blessings of your Lord"],[94,5,"anxious heavy hopeful","garden","For indeed, with hardship comes ease"],[94,6,"anxious hopeful","light","indeed, with hardship comes ease"],[94,7,"newstart worn","peaks","So whenever you are free, strive in worship"],[94,8,"worn","spring","and turn to your Lord in devotion"],[99,7,"wronged","birds","So whoever does an atom’s weight of good will see it"],[99,8,"wronged","dew","and whoever does an atom’s weight of evil will see it"],[102,1,"greed","sea","Competition for worldly gains distracts you [from Allah]"],[103,3,"worn","clouds","except those who believe and do righteous deeds, and exhort one another to the truth and exhort one another to patience"],[106,4,"grateful money","dawn","Who fed them against hunger and made them secure against fear"],[108,2,"grateful","hills","so pray and sacrifice to your Lord alone"],[110,3,"guilty","garden","then glorify the praise of your Lord, and ask His forgiveness. Indeed, He is ever Accepting of Repentance"],[113,1,"afraid","dawn","Say, “I seek refuge with the Lord of the daybreak"],[113,5,"envy","garden","and from the harm of the envier when he envies"],[114,1,"afraid","night","Say, “I seek refuge with the Lord of mankind"]];const STORIES=[
{t:"Yusuf and his brothers",k:[12,92],r:"Surah Yusuf · 12",s:"garden",
b:"A boy tells his father a dream of eleven stars bowing to him. His brothers, jealous of how their father loves him, throw him into the bottom of a well and tell their father a wolf took him. He is sold, imprisoned for a crime he did not commit, and forgotten there for years — then read as a reader of dreams by a king, and raised over the storehouses of Egypt. When famine drives his brothers to him for grain, he knows them, and they do not know him. He gives them their measure, and asks after their father. In the end he says only: no blame on you today.",
h:"Everything that was done to him was the road to where he was needed."},

{t:"Musa at the sea",k:[26,62],r:"Surah Ash-Shu'ara · 26",s:"sea",
b:"Pharaoh's army is behind them and open water is in front. His people say: we are caught. Musa answers that they are not — his Lord is with him, and will guide him. He is told to strike the sea with his staff, and it parts, each side standing like a great mountain. They cross on dry ground. The army follows into the same path and the water returns over them.",
h:"He was told there was a way through before he could see one."},

{t:"Nuh and the ship",k:[11,37],r:"Surah Hud · 11 · Surah Nuh · 71",s:"rain",
b:"For most of a thousand years he calls his people, in the open and in private, at night and in daylight. They put their fingers in their ears and pull their coats over their heads. He is given no crowd, only a few. So he builds a ship on dry land while they pass by laughing at him. Then the sky opens and the ground itself springs water, and the ship carries the few who believed.",
h:"He was not asked to be believed. He was asked to keep calling."},

{t:"Ibrahim in the fire",k:[21,69],r:"Surah Al-Anbiya · 21",s:"light",
b:"He walks into the house of idols his people worship and breaks them, leaving the largest standing with the axe in its hand. Ask them, he says, when they demand to know who did it. They know the statues cannot answer, and knowing it is the whole argument. So they build a fire and throw him into it. The command given to the fire is: be coolness and peace.",
h:"He was not taken out of the fire. He was kept safe inside it."},

{t:"Ibrahim looking for his Lord",k:[6,79],r:"Surah Al-An'am · 6",s:"stars",
b:"Night covers him and he sees a star and says: this is my Lord. It sets, and he says he does not love the things that set. Then the moon rises, and he says the same, and it sets too. Then the sun, the brightest of them, and it goes down like the rest. So he turns his face to the One who made the heavens and the earth.",
h:"He found it by refusing to settle for anything that fades."},

{t:"Maryam and the palm tree",k:[19,25],r:"Surah Maryam · 19",s:"palms",
b:"Alone and carrying a child no one will believe in, the pains of birth drive her to the trunk of a palm tree. She says she wishes she had died before this and been something forgotten. A voice from below her tells her not to grieve — that her Lord has put a stream beneath her, and that if she shakes the trunk of the palm toward herself, ripe dates will fall. So she is told: eat, drink, and be comforted.",
h:"She had to shake the tree herself, but the dates were already ripe."},

{t:"The companions of the cave",k:[18,10],r:"Surah Al-Kahf · 18",s:"cave",
b:"A handful of young people refuse the belief of an entire city and are left with nowhere to stand. They take shelter in a cave and ask their Lord for mercy and for their affair to be set right. They are put to sleep there for three hundred years and more. When they wake they think it has been a day, or part of a day, and send one of them into the city with an old coin to buy food — and the whole city learns what became of them.",
h:"They ran with nothing but the asking, and the asking was enough."},

{t:"Yunus in the darkness",k:[21,87],r:"Surah Al-Anbiya · 21",s:"sea",
b:"He leaves his people in anger, certain that nothing more can be done, and boards a ship. The sea takes him and a great fish swallows him. In the dark, inside the dark, inside the dark, he calls out that there is no god but Him, that He is far above all fault, and that he himself has been among the wrongdoers. He is answered, and delivered — and his people, all of them, believe.",
h:"Admitting he was wrong was the door out."},

{t:"Musa and al-Khidr",k:[18,66],r:"Surah Al-Kahf · 18",s:"river",
b:"Musa travels to meet a servant of God who has been given knowledge he has not. He is told plainly: you will not be able to be patient with me. They set out anyway. The man damages the boat that carried them for free, and Musa objects. He does something terrible to a boy, and Musa objects. He rebuilds a wall in a town that refused them food, and Musa objects again. Then he explains each one — the boat was about to be seized, the wall was hiding an orphan's inheritance — and they part.",
h:"Musa was not wrong to be troubled. He was only seeing part of it."},

{t:"Sulayman and the queen of Sheba",k:[27,44],r:"Surah An-Naml · 27",s:"birds",
b:"A hoopoe bird arrives late and says it has news he has not covered: a nation ruled by a woman, given everything, with a magnificent throne, worshipping the sun. Sulayman sends a letter. She is a careful ruler and tries gifts first; he sends them back. Then her own throne is brought to his court before she arrives, and altered, and she is asked whether it is hers. She says: it is as though it were. She enters a courtyard of glass, thinking it water, and there she gives up the sun.",
h:"She was answered with wonder, not force, and she came willingly."},

{t:"The valley of the ants",k:[27,19],r:"Surah An-Naml · 27",s:"ants",
b:"Sulayman is given command over the wind, the birds and the jinn — armies gathered and set in ranks. They come to a valley of ants, and one ant calls out to the others to get into their homes so that Sulayman and his soldiers do not crush them without noticing. He hears her, and smiles at what she said. Then he asks to be enabled to be thankful for the favour given to him.",
h:"The largest kingdom on earth, stopped by an ant, and grateful for it."},

{t:"The patience of Ayyub",k:[21,83],r:"Surah Sad · 38 · Surah Al-Anbiya · 21",s:"spring",
b:"He loses his wealth, then his children, then his health, until the illness is all that is left of his days. He does not accuse. He calls on his Lord with the shortest of complaints — that adversity has touched him, and that He is the most merciful of the merciful. He is told to strike the ground with his foot, and a cool spring rises there to wash in and to drink from. What he lost is returned, and the like of it with them.",
h:"He kept his complaint between himself and God."},

{t:"The army of the elephant",k:[105,1],r:"Surah Al-Fil · 105",s:"dunes",
b:"An army marches on the Sacred House with an elephant at its head, intending to bring the building down. Nothing in the city could have stopped it. Their plan is put into ruin — birds are sent over them in flocks, throwing stones of hard clay, until the army is left like a field of stalks eaten bare.",
h:"The House was defended by the One whose House it is."},

{t:"Adam and the garden",k:[7,23],r:"Surah Al-A'raf · 7 · Surah Ta-Ha · 20",s:"garden",
b:"He is made and taught the names of all things, and the angels are told to bow, and one refuses out of pride. He and his wife are given the garden and told to eat freely from it, except for one tree. They are whispered to, and they eat, and what was hidden of them becomes apparent to them. They are not left there in shame — they are given words to say, words of return, and they say them.",
h:"The first mistake and the first repentance are told in the same breath."},

{t:"The owners of the garden",k:[68,28],r:"Surah Al-Qalam · 68",s:"wheat",
b:"Men swear that they will pick the fruit of their garden at first light, and make no exception, and say nothing about the will of God — quietly deciding that no poor person will get any of it this year. While they sleep, something passes over the garden. They set out in the morning whispering to each other to keep the poor out, and find it black and stripped bare. At first they think they have come to the wrong place. Then the most balanced of them says: did I not tell you?",
h:"They lost it the night they decided to keep it all."},

{t:"Luqman's advice to his son",k:[31,17],r:"Surah Luqman · 31",s:"path",
b:"A father, given wisdom, teaches his son while advising him. Do not put anything beside God, he says — that is a great wrong. Be good to your parents, who carried you in weakness upon weakness. Know that even the weight of a mustard seed, hidden inside a rock or lost in the heavens or in the earth, will be brought out. Establish prayer, tell people to what is right, bear patiently what comes. Do not turn your cheek away from people in scorn or walk the earth pleased with yourself. Be moderate in your pace, and lower your voice.",
h:"Everything he told his son to do begins with how he holds himself."},

{t:"The mother of Musa",k:[28,7],r:"Surah Al-Qasas · 28",s:"river",
b:"A woman gives birth in a year when the sons of her people are being killed. She is told something no mother is told: nurse him, and when you fear for him, put him in the river, and do not fear and do not grieve — We will return him to you. She lets the water take him. He is picked up by the household that is hunting him. His sister follows at a distance and offers to find a woman who will nurse him, and the woman she brings is his own mother.",
h:"She was asked to let go of him first, and he came back by the same water."},

{t:"The bush in the valley",k:[20,12],r:"Surah Ta-Ha · 20",s:"fire",
b:"He is travelling with his family at night, lost and cold, when he sees a fire on the side of the mountain. He tells them to wait — perhaps he can bring back a burning branch, or find someone at it who knows the way. He goes towards it to get warmth and directions, and is met instead by his Lord, and told to take off his sandals, for he is in the sacred valley.",
h:"He went looking for a coal to carry back and was given his whole life's work."},

{t:"Musa and the magicians",k:[20,70],r:"Surah Ta-Ha · 20",s:"light",
b:"On a day of festival, in front of everyone, the finest magicians in the kingdom throw down their ropes and staffs, and to the crowd's eyes the ground is crawling. Musa feels fear in himself, and is told: do not fear, you are the higher. He throws what is in his right hand and it swallows what they made. The magicians — the ones who knew exactly how the trick was done — fall down in prostration, and Pharaoh threatens them, and they answer that they do not prefer him over what has come to them.",
h:"The people who understood it best were the first to believe it."},

{t:"The calf of gold",k:[20,88],r:"Surah Ta-Ha · 20",s:"embers",
b:"Musa goes to the appointment with his Lord and leaves his brother in charge for thirty nights, made complete with ten. In his absence the people melt down their ornaments and a calf is made for them — a body that makes a lowing sound — and they say this is your god and the god of Musa. Harun tells them they are only being tested, and to follow him, and they say they will not stop until Musa returns. He returns angry and grieving, and takes hold of his brother's head, and Harun says: the people overpowered me.",
h:"It took forty days without him for them to build something that could not speak."},

{t:"Musa asks to see his Lord",k:[7,143],r:"Surah Al-A'raf · 7",s:"quake",
b:"At the appointed meeting he says: my Lord, show me Yourself, that I may look at You. He is told that he will not see Him — but to look at the mountain: if it stays in place, then he will see. His Lord appears to the mountain and it is levelled, and Musa falls unconscious. When he recovers he says: Glory be to You, I turn to You in repentance, and I am the first of the believers.",
h:"The asking was not held against him. The answer was the mountain."},

{t:"The well of Madyan",k:[28,24],r:"Surah Al-Qasas · 28",s:"well",
b:"He arrives in a strange town with nothing, a wanted man, and finds a crowd of shepherds watering their flocks and two women holding theirs back, waiting for the men to leave. He waters their animals for them, asks for nothing, and turns to the shade and says: my Lord, I am in need of whatever good You send me. One of the women comes back, walking shyly, to say her father is asking for him — and there he is given work, and a home, and a wife.",
h:"He prayed as a stranger with nothing, and the answer was already walking towards him."},

{t:"The cow they kept asking about",k:[2,67],r:"Surah Al-Baqarah · 2",s:"cattle",
b:"A man is killed and no one will say who did it. Musa tells his people that Allah commands them to slaughter a cow. They ask if he is mocking them. Then they ask what kind of cow, and are told — then its colour, and are told — then more, saying all cows look alike to us, and each time the description narrows until only one animal in the land will do. They slaughter it, and they had almost not done it.",
h:"A single word would have been enough. They made it hard by asking."},

{t:"Talut and the river",k:[2,249],r:"Surah Al-Baqarah · 2",s:"river",
b:"An army marches out and its commander tells them plainly: Allah will test you with a river — whoever drinks from it is not with me, except one who takes a handful. They drink from it, except a few. Then the few who crossed look at the size of what is in front of them and say they have no power against Jalut and his soldiers today. And those who were certain they would meet their Lord say: how many a small company has overcome a large company by the permission of Allah.",
h:"The river sorted them out long before the enemy did."},

{t:"Dawud and the two men",k:[38,24],r:"Surah Sad · 38",s:"arch",
b:"Two men climb the wall into his private chamber, and he is startled. They say: do not be afraid, we are two disputants, one of us has wronged the other, so judge between us. One has ninety-nine ewes, the other has one, and the first has demanded it from him. Dawud gives judgement at once — he has wronged you by asking. Then he realises he has been tested, and asks his Lord for forgiveness, and falls down bowing, and turns in repentance.",
h:"He judged rightly, and still went down in repentance for how fast he judged."},

{t:"The mountains that sang with him",k:[34,10],r:"Surah Saba · 34",s:"mountains",
b:"Dawud is given a favour from his Lord: mountains, repeat the praise with him — and the birds too. Iron is made soft for him, and he is taught to make full coats of mail and to measure the links well. A king with a workshop, whose praise the hills answered.",
h:"He was given a kingdom and told to keep working with his hands."},

{t:"The wind at Sulayman's command",k:[34,12],r:"Surah Saba · 34",s:"wind",
b:"For Sulayman the wind is made subject — a month's journey in a morning, and a month's journey in an evening. A spring of molten copper is made to flow for him, and there are jinn working in front of him by the permission of his Lord. Everything that a person could want power over, he is given, and told that this is a favour, to see whether he will be grateful.",
h:"The wind itself was under him, and the test was still whether he would say thank you."},

{t:"How Sulayman was found to have died",k:[34,14],r:"Surah Saba · 34",s:"arch",
b:"He dies leaning on his staff, and nothing tells the jinn labouring under him that he has gone. They keep working, believing he is watching. Then a creature of the earth eats through the staff, and he falls, and it becomes clear to them that if they had known the unseen they would not have stayed in that humiliating labour.",
h:"They were kept working by a man who was no longer there. Only the truth freed them."},

{t:"Zakariyya in the chamber",k:[19,4],r:"Surah Maryam · 19",s:"arch",
b:"An old man prays where no one can hear him. He says: my bones have weakened, my head is aflame with grey, and I have never been unblessed in my prayer to You. He is afraid of what comes after him, and his wife has always been barren, so he asks for an heir from his Lord. He is answered with a name no one had carried before him, and told that this is easy for the One who made him when he was nothing.",
h:"He was old, and he still asked for the thing he wanted most."},

{t:"Yahya, given the Book as a boy",k:[19,12],r:"Surah Maryam · 19",s:"pen",
b:"The child is told: take the Book with strength. He is given sound judgement while still a boy, and tenderness from his Lord, and purity, and he is described in one line as dutiful to his parents, and not overbearing or disobedient. Peace be upon him the day he was born, the day he dies, and the day he is raised alive.",
h:"He was a boy who was already carrying something with both hands."},

{t:"Isa speaks in the cradle",k:[19,30],r:"Surah Maryam · 19",s:"light",
b:"Maryam comes back to her people carrying him, and they say something terrible has been brought. She does not argue. She points at the baby. They say: how can we speak to one who is a child in the cradle? And he says: I am the servant of Allah. He has given me the Book and made me a prophet, and made me blessed wherever I am, and told me to pray and to give while I live, and to be good to my mother.",
h:"Her defence was not her words. It was him."},

{t:"The table sent down",k:[5,114],r:"Surah Al-Ma'idah · 5",s:"clouds",
b:"The disciples ask Isa whether his Lord is able to send down a table spread with food from the sky. He tells them to be mindful of Allah if they are believers. They say they only want to eat from it and have their hearts reassured and know he has told them the truth. So he asks: our Lord, send down to us a table from the sky, that it may be a festival for the first of us and the last of us, and a sign from You.",
h:"They asked for a sign, and were warned about what asking for one costs."},

{t:"Ibrahim and the four birds",k:[2,260],r:"Surah Al-Baqarah · 2",s:"birds",
b:"He says: my Lord, show me how You give life to the dead. He is asked: do you not believe? He says he does — but so that his heart may be at rest. So he is told to take four birds and make them incline to him, then to place a portion of them on each hill, and then to call them. They come to him in haste.",
h:"He already believed. He was still allowed to ask to see it."},

{t:"The one who argued about his Lord",k:[2,258],r:"Surah Al-Baqarah · 2",s:"sun",
b:"A man given a kingdom argues with Ibrahim about who his Lord is. Ibrahim says: my Lord is the One who gives life and causes death. The man says he too gives life and causes death — he spares one prisoner and kills another. So Ibrahim says: then Allah brings the sun from the east, so bring it from the west. And the one who disbelieved was dumbfounded.",
h:"The argument ended the moment it was moved outside a man's own reach."},

{t:"Raising the foundations of the House",k:[2,127],r:"Surah Al-Baqarah · 2",s:"arch",
b:"An old man and his son build with stone in an empty valley. As the walls rise they say: our Lord, accept this from us, You are the Hearing, the Knowing. They ask to be made submissive to Him, and for a nation from their offspring the same, and to be shown their rites, and for a messenger to be raised from among them. Two people building, and praying that it be accepted while they are still building it.",
h:"They did the work and asked for it to be accepted in the same breath."},

{t:"The dream of the sacrifice",k:[37,102],r:"Surah As-Saffat · 37",s:"dunes",
b:"He tells his son what he has seen in a dream — that he is sacrificing him — and asks what he thinks. The boy says: father, do what you are commanded; you will find me, if Allah wills, of the patient. They both submit, and he lays him down on his forehead, and he is called: you have fulfilled the vision. A great sacrifice is put in the boy's place.",
h:"It was over the moment they both said yes. The knife was never the point."},

{t:"The man who passed a ruined town",k:[2,259],r:"Surah Al-Baqarah · 2",s:"ruins",
b:"He passes a town fallen in on its roofs and says: how will Allah bring this to life after its death? So Allah causes him to die for a hundred years, then raises him and asks how long he stayed. He says a day, or part of a day. He is told: a hundred years — and to look at his food and drink, which have not spoiled, and at his donkey, which has not. And to look at the bones, how they are put together and covered with flesh. Then he says: I know that Allah is able to do all things.",
h:"He asked a question about a town and was answered with his own hundred years."},

{t:"The two sons of Adam",k:[5,31],r:"Surah Al-Ma'idah · 5",s:"birds",
b:"Two brothers each offer something. One offering is accepted and the other is not, and the one refused says: I will surely kill you. His brother answers that Allah accepts from the mindful, and that if you raise your hand against me, I will not raise mine against you. He kills him anyway, and then stands there not knowing what to do with his brother's body — until a crow scratches in the ground to show him how to bury it, and he says: am I unable to be even like this crow?",
h:"The first murder, and the first shame, and a bird had to teach him what to do next."},

{t:"The son who would not board",k:[11,43],r:"Surah Hud · 11",s:"sea",
b:"The water is rising and the ship is moving in waves like mountains. Nuh calls out to his son, standing apart: come with us, and do not be with the disbelievers. The boy says he will take himself to a mountain that will protect him from the water. His father says there is no protector today except the One who has mercy — and a wave comes between them.",
h:"He was told there was no high ground left, and he still went looking for one."},

{t:"The cloud that 'Ad were glad to see",k:[46,24],r:"Surah Al-Ahqaf · 46",s:"whirlwind",
b:"A people of great strength are warned and answer that no one is stronger than they are. Then they see a cloud coming towards their valleys, and they say: this is a cloud that will bring us rain. They are told: no — it is what you asked to be hurried, a wind in which is a painful punishment, destroying everything by the command of its Lord. In the morning nothing could be seen but their dwellings.",
h:"They looked at what was coming for them and called it a blessing."},

{t:"Salih and the she-camel",k:[7,73],r:"Surah Al-A'raf · 7",s:"quake",
b:"He tells his people that this she-camel is a sign for them — leave her to eat in the land of Allah, and do not touch her with harm. She has her day to drink and they have theirs. They hamstring her, and then say to him: bring us what you promise us, if you are of the messengers. The earthquake seized them, and in the morning they lay lifeless in their homes.",
h:"They were given one animal to leave alone, and could not leave her alone."},

{t:"Shu'ayb and the measure",k:[11,85],r:"Surah Hud · 11",s:"balance",
b:"He tells his people to give full measure and weight in justice, and not to short-change people in their things, and not to go about the earth spreading corruption. They ask him whether his prayer is telling him that they should leave what their fathers worshipped, or stop doing what they like with their own wealth. He says he only wants to set things right as much as he can, and that his success is only with Allah.",
h:"He was preaching about scales, and they heard it as an attack on their money."},

{t:"Lut and the last night",k:[11,81],r:"Surah Hud · 11",s:"dawn",
b:"Guests come to him and he is distressed for them, because he knows his people and what they rush to do. They surround the house. He offers them anything else and asks whether there is not one right-minded man among them. Then his guests tell him who they are — messengers who will not be reached — and to travel with his family in a part of the night, and not to look back, and that their appointed time is the morning. Is the morning not near?",
h:"He was told the worst night he had ever had was almost over."},

{t:"Yusuf and the locked doors",k:[12,33],r:"Surah Yusuf · 12",s:"gate",
b:"The woman of the house he serves in bolts the doors and calls him to herself. He says: I seek the refuge of Allah. The doors are locked, no one would know, and the danger of refusing is real — she says plainly that if he does not do what she orders, he will be imprisoned and humiliated. And he says: prison is dearer to me than what they call me to.",
h:"He did not say it was impossible. He said prison was the better of the two."},

{t:"Two dreams in a prison",k:[12,39],r:"Surah Yusuf · 12",s:"lampnight",
b:"Two young men come to him with dreams to be read — one sees himself pressing wine, the other carrying bread on his head that birds eat from. Before he answers either of them, he says: my two companions of the prison, are separate lords better, or Allah, the One, the Prevailing? Then he tells them what their dreams mean, and asks the one who will be saved to mention him to his master. The man forgets, and Yusuf stays there several more years.",
h:"He preached in a prison to two men, one of whom was about to die."},

{t:"Seven fat cows and seven lean",k:[12,47],r:"Surah Yusuf · 12",s:"wheat",
b:"A king dreams of seven fat cows eaten by seven lean ones, and seven green ears and seven dry, and no one in his court can read it. The man who was released from prison finally remembers Yusuf, and goes to him. Yusuf reads it without asking for anything: sow for seven years as usual, and leave what you harvest in its ear except a little that you eat; then seven hard years will eat what you stored for them; then a year in which people will be given rain, and will press.",
h:"Seven good years were given to him as a warning, not as a reward."},

{t:"Ya'qub's eyes",k:[12,84],r:"Surah Yusuf · 12",s:"dusk",
b:"He turns away from them and says: my grief is for Yusuf. His eyes go white from sorrow, and he holds it in. They tell him he will not stop remembering Yusuf until he is ruined, and he answers that he only complains of his sorrow and grief to Allah, and that he knows from Allah what they do not know. Then he sends them back to look — and tells them not to despair of the mercy of Allah.",
h:"He wept for years and never once said it out loud to anyone but God."},

{t:"The man with two gardens",k:[18,39],r:"Surah Al-Kahf · 18",s:"vines",
b:"One man has two gardens of vines with palms around them and a stream running through, and both give their fruit without failing in anything. He says to his companion: I have more wealth than you and more men. And he goes into his garden wronging himself and says he does not think this will ever perish. His companion says: why, when you entered your garden, did you not say — what Allah wills; there is no power except with Allah. In the morning he is turning his hands over in regret at what he spent on it.",
h:"He had everything, and the one sentence he would not say was the one that would have kept it."},

{t:"Dhul-Qarnayn and the barrier",k:[18,96],r:"Surah Al-Kahf · 18",s:"embers",
b:"A people caught between two mountains, harassed by those on the other side, offer him payment to build a wall. He says what his Lord has established him in is better, so help me with strength instead. He asks for sheets of iron until the gap is level, tells them to blow until it is fire, and pours molten copper over it. Then he says: this is a mercy from my Lord — and when the promise of my Lord comes, He will make it level with the ground.",
h:"He built it and said in the same breath that it would not last forever."},

{t:"Qarun and what he was given",k:[28,81],r:"Surah Al-Qasas · 28",s:"ruins",
b:"A man of Musa's own people is given treasure whose keys alone weighed down a group of strong men. He is told not to rejoice arrogantly, and to seek the home of the hereafter with what he has been given without forgetting his share of the world. He says: I was only given it because of knowledge I have. He goes out before his people in his finery, and those who want the life of this world wish they were him. Then the earth swallowed him and his home.",
h:"By the next morning the people who envied him were saying: it could have been us."},

{t:"The believer who hid his faith",k:[40,28],r:"Surah Ghafir · 40",s:"veil",
b:"A man from Pharaoh's own family, who had kept his faith hidden, speaks up while they are deciding to kill Musa: are you going to kill a man for saying my Lord is Allah, when he has brought you clear proofs? If he is lying, his lie is on him; if he is truthful, some of what he threatens will strike you. He keeps arguing, alone in that room, and at the end entrusts his affair to Allah.",
h:"He had hidden it for years, and spoke on the day it cost the most."},

{t:"The man who came running",k:[36,20],r:"Surah Ya-Sin · 36",s:"path",
b:"Messengers come to a town and are called liars and threatened with stoning. Then from the farthest end of the city a man comes running and says: my people, follow the messengers — follow those who ask you for no payment and are rightly guided. He asks why he should not worship the One who created him. They kill him for it, and it is said to him: enter the Garden. He says: if only my people knew how my Lord has forgiven me.",
h:"The last thought of a man they killed was that he wished they could see this."},

{t:"The people of the ditch",k:[85,4],r:"Surah Al-Buruj · 85",s:"fire",
b:"A trench is dug and filled with fuel and set alight, and people are thrown into it for one reason: that they believed in Allah, the Almighty, the Praiseworthy. Those who did it sat at the edge and watched what they were doing to the believers. The account is told in a few lines, and it ends not with the fire but with a verdict against the ones who lit it.",
h:"The Qur'an remembers the burned, and names what was done to them, forever."},

{t:"The night journey",k:[17,1],r:"Surah Al-Isra · 17",s:"nightpath",
b:"Glory be to the One who took His servant by night from the Sacred Mosque to the Farthest Mosque, whose surroundings He has blessed, to show him some of His signs. One sentence, at the start of a surah, for a journey no one who heard about it the next morning could believe — and the surah then turns immediately to how to treat your parents, and orphans, and what you say, and how you walk.",
h:"He was taken through the heavens and came back with instructions about ordinary days."},

{t:"Two in the cave",k:[9,40],r:"Surah At-Tawbah · 9",s:"cave",
b:"They are being hunted, two men in a cave, and the search has reached the mouth of it. His companion is afraid. He says to him: do not grieve — indeed Allah is with us. So Allah sent down His tranquillity upon him and supported him with soldiers no one could see.",
h:"There was nowhere left to go, and the sentence he chose was: do not grieve."},

{t:"The day of the trench",k:[33,10],r:"Surah Al-Ahzab · 33",s:"wind",
b:"Armies come at them from above and below, until eyes turn aside and hearts reach the throats, and people are thinking all kinds of thoughts about Allah. There the believers were tested and shaken with a severe shaking. Then a wind is sent against the gathered armies, and soldiers no one could see, and they are turned back having gained nothing.",
h:"The Qur'an says outright how frightened they were, and then what came."},

{t:"The truce that was called a victory",k:[48,1],r:"Surah Al-Fath · 48",s:"path",
b:"They set out for the Sacred House and are stopped short of it, and agree to terms that felt to many of them like a defeat — go home this year, come back the next, and send back anyone who comes to you from them. On the way back the words come down: indeed We have given you a clear victory. What looked like the worst day was the opening.",
h:"It was named a victory before anyone could see how it would turn out."},

{t:"The lie that was answered from above",k:[24,11],r:"Surah An-Nur · 24",s:"veil",
b:"A rumour is spread about the household of the Prophet, and the town carries it in its mouths for a month, and every one who passed it on had a share in it. The verses come down: do not think it is bad for you — it is good for you. Why, when you heard it, did the believing men and women not think well of their own people, and say: this is a clear lie? And a warning to anyone who takes it lightly: you thought it a small thing, and with Allah it is enormous.",
h:"The Qur'an stopped to deal with a piece of gossip, and called it enormous."},

{t:"He frowned",k:[80,1],r:"Surah 'Abasa · 80",s:"shadows",
b:"A blind man comes asking to be taught, while the Prophet is busy speaking to the chiefs of his people, hoping they will listen. He frowns and turns away — and a whole surah opens by correcting it: he frowned and turned away, because the blind man came to him. What would make you know? Perhaps he would be purified. As for the one who thinks himself in no need of you — to him you give attention.",
h:"The correction was written down and recited forever, over one man who was overlooked."},

{t:"Iram of the pillars",k:[89,7],r:"Surah Al-Fajr · 89",s:"ruins",
b:"Have you not seen how your Lord dealt with 'Ad — Iram, of the lofty pillars, the like of which had never been built in the land? And Thamud, who carved the rocks in the valley? And Pharaoh, of the stakes? All of them transgressed in the land and increased corruption in it, so your Lord poured down on them a scourge of punishment. Three civilisations named in six lines, each of them sure it was permanent.",
h:"Everything they built to last is a question in a surah now."},

{t:"The town by the sea",k:[7,163],r:"Surah Al-A'raf · 7",s:"sea",
b:"Ask them about the town that was by the sea, when they broke the Sabbath — when their fish came to them on the day they were told to rest, plainly at the surface, and did not come on the days they did not rest. Some of them found a way around the rule while keeping the words of it. And some of the town spoke against it, and some said: why bother warning people God is going to punish anyway? And they answered: so that we have an excuse before your Lord.",
h:"The ones who kept speaking said they did it so they could face God, not to win."},

{t:"Twelve springs from a stone",k:[2,60],r:"Surah Al-Baqarah · 2",s:"spring",
b:"Musa asks for water for his people and is told to strike the stone with his staff, and twelve springs burst from it — each tribe knowing its own drinking place. Eat and drink from the provision of Allah, they are told, and do not go about the earth spreading corruption. And a little later the same people are asking for onions and lentils instead of what they were given.",
h:"Water came out of a rock for them, and within a page they were complaining about the menu."},

{t:"The dam at Saba",k:[34,16],r:"Surah Saba · 34",s:"orchard",
b:"A people are given two gardens, on the right and on the left, and told: eat from the provision of your Lord and be grateful to Him — a good land, and a forgiving Lord. They turn away, so the flood of the dam is sent against them, and their two gardens are exchanged for two gardens of bitter fruit and tamarisk and a few thorny trees. That is how they were repaid for their ingratitude.",
h:"Nothing was taken from them until they stopped noticing they had been given it."}
];

const cv=document.getElementById('scene'), cx=cv.getContext('2d');
let W=0,H=0,FIELD=[];
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth=window.innerWidth; H=cv.clientHeight=window.innerHeight;
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  FIELD=[]; for(let i=0;i<200;i++) FIELD.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.25,p:Math.random()*6.28,s:Math.random()*.6+.2});
}
window.addEventListener('resize',sizeCanvas);

const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(a,al)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const W_=x=>W*x, H_=y=>H*y;

/* ── silhouette helpers ── */
function silhouette(pts,alpha){
  cx.beginPath(); cx.moveTo(0,H);
  pts.forEach(p=>cx.lineTo(p[0],p[1]));
  cx.lineTo(W,H); cx.closePath();
  cx.fillStyle=`rgba(0,0,0,${alpha})`; cx.fill();
}
function ridgeline(base,amp,n,seed,alpha){
  const pts=[];
  for(let i=0;i<=n;i++){
    const x=W*i/n;
    const y=H*base - Math.abs(Math.sin(i*1.7+seed))*H*amp - Math.abs(Math.cos(i*.9+seed*2))*H*amp*.35;
    pts.push([x,y]);
  }
  silhouette(pts,alpha); return pts;
}

let curIdx=0, prevIdx=null, fade=1,
    curPal=[hex(PAL.night[0]),hex(PAL.night[1]),hex(PAL.night[2])], tgtPal=curPal,
    motionOn=true, t0=performance.now();

function setSceneIdx(i){
  if(i===curIdx || i==null) return;
  prevIdx=curIdx; curIdx=i; fade=0;
  const p=PAL[SCENES[i].p];
  tgtPal=[hex(p[0]),hex(p[1]),hex(p[2])];
  document.documentElement.style.setProperty('--glow',p[3]);
}
function sceneForGroup(g,seed){
  const arr=SCENE_OF[g]||SCENE_OF.stars;
  return arr[Math.abs(seed)%arr.length];
}
function drawScene(i,t,alpha){
  cx.globalAlpha=alpha;
  SCENES[i].L.forEach(n=>{ cx.save(); try{ L[n](t); }catch(e){} cx.restore(); });
  cx.globalAlpha=1;
}
function frame(now){
  const t = motionOn ? (now-t0)/1000 : 14;
  curPal=curPal.map((c,i)=>mixc(c,tgtPal[i],.05));
  if(fade<1) fade=Math.min(1,fade+.015);
  const g=cx.createLinearGradient(0,0,W*.35,H);
  g.addColorStop(0,rgba(curPal[0],1)); g.addColorStop(.55,rgba(curPal[1],1)); g.addColorStop(1,rgba(curPal[2],1));
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  if(prevIdx!=null && fade<1) drawScene(prevIdx,t,1-fade);
  drawScene(curIdx,t,fade);
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════
   HOW THE NEXT ONE IS CHOSEN — a deck that remembers you.
   Not a dice roll and no longer a plain shuffle bag:
     · every verse in the pool is dealt once before any of them
       comes back, and the deck is reshuffled for each round
     · the deck and a memory of what you have seen are written
       to this device, so closing the page and coming back
       carries on where you were instead of starting over
     · a card is put back under the deck rather than dealt if
       it repeats the surah you just read, or the scene you are
       still looking at, or anything from your recent memory
   The effect is that the page rarely shows you the same thing
   twice, and almost never shows you the same sky twice in a row.
   ══════════════════════════════════════════════════════════ */
let DECKS={}, RECENT=[];          /* both are filled from this device at start-up */
let LASTSURAH=null, LASTGROUP=null;
function loadDeck(){ DECKS=store.get('decks')||{}; RECENT=store.get('recent')||[]; }
function shuffled(a){ a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }
function draw(key,items,meta){
  if(!items||!items.length) return null;
  const valid=new Set(items);
  let deck=(DECKS[key]||[]).filter(i=>valid.has(i));
  if(!deck.length) deck=shuffled(items);
  const win=Math.min(RECENT.length,Math.max(0,Math.floor(items.length*.35)));
  const recent=win?RECENT.slice(-win):[];
  let pick=null; const passed=[];
  for(let n=0;n<12 && deck.length;n++){
    const c=deck.pop(), m=meta(c);
    if(recent.indexOf(m.k)<0 && !(m.s!=null&&m.s===LASTSURAH) && !(m.g!=null&&m.g===LASTGROUP)){ pick=c; break; }
    passed.push(c);
  }
  if(pick==null && passed.length) pick=passed.shift();
  DECKS[key]=passed.concat(deck);
  store.set('decks',DECKS);
  if(pick!=null){ const m=meta(pick);
    LASTSURAH=m.s; LASTGROUP=m.g;
    RECENT.push(m.k); if(RECENT.length>140) RECENT=RECENT.slice(-140);
    store.set('recent',RECENT); }
  return pick;
}

/* ══════════════════════════════════════════════════════════
   TEXT SOURCES
   English is bundled in this file and needs no connection.
   Other languages / the whole Qur'an are fetched once from a
   CDN, with three mirrors tried in turn.
   ══════════════════════════════════════════════════════════ */
const MIRRORS=[
  'https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/',
  'https://raw.githubusercontent.com/fawazahmed0/quran-api/1/',
  'https://cdn.statically.io/gh/fawazahmed0/quran-api/1/'
];
async function fetchJSON(path){
  let err=null;
  for(const m of MIRRORS){
    try{
      const r=await fetch(m+path,{cache:'force-cache'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ err=e; }
  }
  throw err||new Error('unreachable');
}

function tafsirFor(lang){

  if(!TAFSIR[k]) for(const n in TAFSIR) if(k.indexOf(n)===0){ k=n; break; }

async function fetchTafsir(slug,c,a){
  let err=null;
  for(const m of TAFSIR_MIRRORS){
    /* a mirror that hangs must not hold the whole thing up — give each one 9 seconds */
    const ac=(typeof AbortController!=='undefined')?new AbortController():null;
    const timer=ac?setTimeout(()=>ac.abort(),9000):null;
    try{
      const r=await fetch(m+slug+'/'+c+'/'+a+'.json',{cache:'force-cache',signal:ac?ac.signal:undefined});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      const txt=cleanTafsir(j&&j.text);
      if(!txt) throw new Error('empty');
      return txt;
    }catch(e){ err=e; }
    finally{ if(timer) clearTimeout(timer); }
  }
  throw err||new Error('unreachable');
}
/* the files carry a little markup and a lot of whitespace */
function cleanTafsir(s){
  return String(s||'')
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|h\d)>/gi,'\n\n').replace(/<[^>]*>/g,'')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"')
    .replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
/* cut to the last sentence that fits, so a short reading still ends properly */
function shorten(s,limit){
  if(s.length<=limit) return [s,false];
  let cut=s.slice(0,limit), best=-1;
  ['. ','۔','؟','। ','! ','? ','\n','।'].forEach(p=>{ const i=cut.lastIndexOf(p); if(i>best) best=i+p.length; });
  if(best>limit*.45) return [cut.slice(0,best).trim(),true];
  const sp=cut.lastIndexOf(' ');
  return [(sp>0?cut.slice(0,sp):cut).trim()+'…',true];
}

async function tfetch(url){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const timer=ac?setTimeout(()=>ac.abort(),12000):null;
  try{
    const r=await fetch(url,{signal:ac?ac.signal:undefined});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally{ if(timer) clearTimeout(timer); }
}
const flatStrings=j=>{ const out=[]; (function w(x){ if(typeof x==='string') out.push(x);
  else if(Array.isArray(x)) x.forEach(w); })(j); return out; };
async function trBatch(texts,code){
  const j=await tfetch('https://translate.googleapis.com/translate_a/t?client=dict-chrome-ex&sl=en&tl='+
    encodeURIComponent(code)+texts.map(x=>'&q='+encodeURIComponent(x)).join(''));
  const out=flatStrings(j);
  if(out.length!==texts.length) throw new Error('shape');
  return out;
}
async function trOne(text,code){
  const j=await tfetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='+
    encodeURIComponent(code)+'&dt=t&q='+encodeURIComponent(text));
  const s=(j[0]||[]).map(p=>(p&&p[0])||'').join('');
  if(!s) throw new Error('empty'); return s;
}
async function trOneAlt(text,code){
  const j=await tfetch('https://api.mymemory.translated.net/get?langpair=en%7C'+
    encodeURIComponent(code)+'&q='+encodeURIComponent(text));
  const s=j&&j.responseData&&j.responseData.translatedText;
  if(!s||/MYMEMORY WARNING|QUERY LENGTH|INVALID/i.test(s)) throw new Error('alt');
  return s;
}
/* one mirror, then the other, then one string at a time — whatever gets through */
async function translateMany(texts,code){
  const out=new Array(texts.length).fill(null);
  const chunks=[]; let cur=[], len=0;
  texts.forEach((x,i)=>{ if(cur.length && (len+x.length>1100 || cur.length>=10)){ chunks.push(cur); cur=[]; len=0; }
    cur.push(i); len+=x.length; });
  if(cur.length) chunks.push(cur);
  for(const ch of chunks){
    try{ const got=await trBatch(ch.map(i=>texts[i]),code); ch.forEach((i,n)=>out[i]=got[n]); continue; }catch(e){}
    for(const i of ch){
      try{ out[i]=await trOne(texts[i],code); }
      catch(e){ try{ out[i]=await trOneAlt(texts[i],code); }catch(e2){} }
    }
  }
  return out;
}

function applyBucket(name){
  const b=TRCACHE[name]||{}; UI={};
  Object.keys(b).forEach(k=>{ if(k.slice(0,2)==='s.') UI[k.slice(2)]=b[k];
    else if(k.slice(0,3)==='mn.'||k.slice(0,3)==='ms.') UI[k]=b[k]; });
  applyStrings();
}
async function translateUI(name,code){
  const b=trBucket(name), keys=[], src=[];
  Object.keys(STR).forEach(k=>{ if(!b['s.'+k]){ keys.push('s.'+k); src.push(STR[k]); } });
  MOODS.forEach(m=>{ if(!b['mn.'+m[0]]){ keys.push('mn.'+m[0]); src.push(m[1]); }
                     if(!b['ms.'+m[0]]){ keys.push('ms.'+m[0]); src.push(m[2]); } });
  if(!keys.length) return true;
  const got=await translateMany(src,code);
  let n=0; got.forEach((g,i)=>{ if(g){ b[keys[i]]=g; n++; } });
  saveTr();
  return n>0;
}
/* ── the events follow too ──
   Nothing is ever shown in English and then swapped underneath you:
   an event is only painted once its own language is ready. To keep
   that from being a wait, the whole set is fetched quietly in the
   background as soon as a language is chosen, and the next card in
   the deck is always fetched before you can reach it. */
function storyFor(i){
  const st=STORIES[i], b=TRCACHE[LANGNAME], o=b&&b['st.'+i];
  return o?{t:o.t||st.t,b:o.b||st.b,h:o.h||st.h,r:o.r||st.r,s:st.s,k:st.k}:st;
}
function storyReady(i){
  const code=codeFor(LANGNAME);
  if(!code||code==='en') return true;
  const b=TRCACHE[LANGNAME];
  return !!(b&&b['st.'+i]);
}
const STORYJOBS={};
function wantStory(i){
  const code=codeFor(LANGNAME);
  if(!code||code==='en'||storyReady(i)) return Promise.resolve();
  const jobKey=LANGNAME+'|'+i;
  if(STORYJOBS[jobKey]) return STORYJOBS[jobKey];
  const st=STORIES[i];
  const job=(async()=>{
    try{
      const got=await translateMany([st.t,st.b,st.h,st.r],code);
      if(!got[1]) return;
      trBucket(LANGNAME)['st.'+i]={t:got[0]||st.t,b:got[1],h:got[2]||st.h,r:got[3]||st.r};
      saveTr();
      if(CUR&&CUR.type==='story'&&CUR.i===i){ CUR.story=storyFor(i); paintStory(); }
      renderFavourites();
    }catch(e){}
    finally{ delete STORYJOBS[jobKey]; }
  })();
  STORYJOBS[jobKey]=job;
  return job;
}
/* the card the deck will hand you next, so it is ready before you tap */
function peekStory(){
  const d=DECKS['stories'];
  return (d&&d.length)?d[d.length-1]:null;
}
/* every event, quietly, once — after this a language is fully offline */
let prefetching=null;
async function prefetchStories(){
  const code=codeFor(LANGNAME);
  if(!code||code==='en'||prefetching) return;
  const lang=LANGNAME;
  prefetching=(async()=>{
    for(let i=0;i<STORIES.length;i++){
      if(LANGNAME!==lang) break;              /* the language changed under us */
      if(storyReady(i)) continue;
      await wantStory(i);
      await new Promise(r=>setTimeout(r,120));
    }
    prefetching=null;
  })();
}

/* pull the sheet back down to close it */
let sy=null, sdy=0, sTop=0;
scard.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  sy=e.touches[0].clientY; sdy=0; sTop=scard.scrollTop;
},{passive:true});
scard.addEventListener('touchmove',e=>{
  if(sy==null) return;
  sdy=e.touches[0].clientY-sy;
  if(sdy>0 && sTop<=0){ scard.classList.add('dragging');
    scard.style.transform='translateY('+(sdy*.72)+'px)';

/* ══ explain the verse in front of you, from a published tafsir ══ */
let EXPV=null;   /* {c,a,ed,text,short,cut,open,deep,deepOpen,deepBusy} */
async function explain(){
  if(!CUR) return;
  const ref = CUR.type==='verse' ? [CUR.c,CUR.a] : (CUR.story&&CUR.story.k);
  if(!ref){ openSheet(t('sheet.explain'),`<p class="quiet">${esc(t('sheet.noVerse'))}</p>`); return; }
  const ed=tafsirFor(LANGNAME), [c,a]=ref, key=ed.b[0]+':'+c+':'+a;
  openSheet(t('sheet.explain'),`<p class="quiet">${esc(t('sheet.thinking'))}</p>`);
  let text=EXPCACHE[key];
  if(!text){
    try{ text=await fetchTafsir(ed.b[0],c,a); EXPCACHE[key]=text; saveExp(); }
    catch(e){ if(sheet.classList.contains('on'))
      openSheet(t('sheet.explain'),`<p class="quiet">${esc(t('sheet.failed'))}</p>`); return; }
  }
  if(!sheet.classList.contains('on')) return;
  const [shortText,cut]=shorten(text,S.expLen==='long'?100000:620);
  EXPV={c,a,ed,text,short:shortText,cut,open:S.expLen==='long',deep:null,deepOpen:false,deepBusy:false};
  paintExplain();
}
function paintExplain(){
  const v=EXPV; if(!v) return;
  const ed=v.ed;
  let h=`<div class="sref">${esc(SURAHS[v.c-1])} · ${v.c}:${v.a}</div>`;
  h+=paras(v.open?v.text:v.short);
  if(v.cut && !v.open) h+=`<button class="cta" data-exp="full">${esc(t('sheet.readFull'))}</button>`;
  if(ed.f){
    if(v.deep){ h+=`<div class="gtitle">${esc(ed.f[1])}</div>`+paras(v.deepOpen?v.deep.text:v.deep.short);
      if(v.deep.cut && !v.deepOpen) h+=`<button class="cta" data-exp="deepfull">${esc(t('sheet.readFull'))}</button>`; }
    else h+=`<button class="cta" data-exp="deep">${esc(v.deepBusy?t('sheet.deepLoading'):t('sheet.deeper'))}</button>`;
  }
  h+=`<p class="src">${esc(t('sheet.source'))}<b>${esc(ed.b[1])}</b>. ${esc(t('sheet.sourceFoot'))}</p>`;
  sheetBody.style.direction=S.dir==='rtl'?'rtl':'ltr';
  sheetBody.style.textAlign='start';
  sheetBody.innerHTML=h;
}
sheetBody.addEventListener('click',async e=>{
  const b=e.target.closest('[data-exp]'); if(!b||!EXPV) return;
  const w=b.dataset.exp, v=EXPV;
  if(w==='full'){ v.open=true; paintExplain(); return; }
  if(w==='deepfull'){ v.deepOpen=true; paintExplain(); return; }
  if(w==='deep'){
    if(v.deepBusy) return;
    v.deepBusy=true; paintExplain();
    const slug=v.ed.f[0], key=slug+':'+v.c+':'+v.a;
    let text=EXPCACHE[key];
    try{ if(!text){ text=await fetchTafsir(slug,v.c,v.a); EXPCACHE[key]=text; saveExp(); } }
    catch(err){ v.deepBusy=false; if(EXPV===v) paintExplain(); return; }
    if(EXPV!==v) return;
    const [s,cut]=shorten(text,1800);
    v.deep={text,short:s,cut}; v.deepBusy=false; paintExplain();
  }
});

/* ══ gestures: tap = next · double tap = keep · swipe up = explain, swipe down = close ══ */
let tapTimer=null, lastTap=0, tStartY=null, tStartX=null, tStartT=0, swiped=false;
stage.addEventListener('touchstart',e=>{ const p=e.touches[0]; tStartY=p.clientY; tStartX=p.clientX; tStartT=Date.now(); swiped=false; },{passive:true});
stage.addEventListener('touchend',e=>{
  if(tStartY==null) return;
  const p=e.changedTouches[0], dy=p.clientY-tStartY, dx=p.clientX-tStartX, dt=Date.now()-tStartT;
  tStartY=null;
  if(Math.abs(dx)>70 || dt>700) return;
  if(dy<-64){ swiped=true; clearTimeout(tapTimer); tapTimer=null; explain(); }
  else if(dy>64 && sheet.classList.contains('on')){ swiped=true; closeSheet(); }
},{passive:true});
/* the same two moves with a mouse wheel or trackpad, for anyone on a desktop */
let wheelLock=0;
stage.addEventListener('wheel',e=>{
  const now=Date.now(); if(now<wheelLock) return;
  if(e.deltaY<-42){ wheelLock=now+900; explain(); }
},{passive:true});
stage.addEventListener('click',()=>{
  if(swiped){ swiped=false; return; }
  if(bloom.classList.contains('open')){ setBloom(false); return; }
  const now=Date.now();
  if(now-lastTap<300){ clearTimeout(tapTimer); tapTimer=null; lastTap=0; toggleLike(); return; }
  lastTap=now;
  tapTimer=setTimeout(()=>{ tapTimer=null; advance(); },250);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeSheet(); closePanels(); setBloom(false); return; }
  if(sheet.classList.contains('on')){ if(e.key==='ArrowDown'){ e.preventDefault(); closeSheet(); } return; }
  if(document.querySelector('.panel.on')) return;
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); advance(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); explain(); }
  if(e.key==='l'||e.key==='L') toggleLike();
});

/* ══ languages ══ */
const langlist=document.getElementById('langlist'), langsearch=document.getElementById('langsearch'),
      langnote=document.getElementById('langnote');
let EDITIONS=null;
async function buildLangs(){
  if(EDITIONS){ renderLangs(langsearch.value.trim().toLowerCase()); return; }
  langlist.innerHTML=`<div class="gtitle">${esc(t('lang.loading'))}</div>`;
  try{ const j=await fetchJSON('editions.json');
    EDITIONS=Object.values(j).filter(e=>e.name&&e.language); renderLangs(''); }
  catch(e){ EDITIONS=null; langlist.innerHTML=`<div class="note">${esc(t('lang.offline'))}</div>`; }
}
function renderLangs(q){
  if(!EDITIONS) return;
  const groups=new Map();
  EDITIONS.forEach(e=>{ const ln=e.language;
    if(q && !(ln.toLowerCase().includes(q)||(e.author||'').toLowerCase().includes(q))) return;
    if(!groups.has(ln)) groups.set(ln,[]); groups.get(ln).push(e); });
  const keys=[...groups.keys()].sort((a,b)=>a==='English'?-1:b==='English'?1:a.localeCompare(b));
  if(!keys.length){ langlist.innerHTML=`<div class="gtitle">${esc(t('lang.none'))}</div>`; return; }
  langlist.innerHTML=`<button class="lang" data-id="built-in" data-lang="English" data-dir="ltr" ${S.edition==='built-in'?'aria-current="true"':''}>
      <span class="l-n">English</span><span class="l-t">${esc(t('lang.builtin'))}</span></button>`+
    keys.map(k=>`<div class="gtitle">${esc(k)}</div>`+groups.get(k).map(e=>
      `<button class="lang" data-id="${esc(e.name)}" data-lang="${esc(k)}" data-dir="${e.direction||'ltr'}" ${e.name===S.edition?'aria-current="true"':''}>
        <span class="l-n">${esc(k)}</span><span class="l-t">${esc(e.author||'')}</span></button>`).join('')).join('');
}
langsearch.addEventListener('input',()=>renderLangs(langsearch.value.trim().toLowerCase()));
langlist.addEventListener('click',async e=>{
  const b=e.target.closest('.lang'); if(!b) return;
  const id=b.dataset.id, ln=b.dataset.lang||'English';
  if(id==='built-in'){ S.edition='built-in'; S.dir='ltr'; fullQuran=null;
    if(S.pool==='all'){S.pool='curated';} rebuildBag();
    renderLangs(langsearch.value.trim().toLowerCase()); closePanels(); showVerse(false);
    setLanguage('English'); return; }
  if(!EDCACHE[id]){
    const lab=b.querySelector('.l-t'), prev=lab.textContent; lab.textContent=t('lang.downloading');
    try{ const j=await fetchJSON('editions/'+id+'.min.json');
      EDCACHE[id]=indexEdition(j.quran); EDCACHE['_arr_'+id]=j.quran; lab.textContent=prev; }
    catch(err){ lab.textContent=prev; langnote.innerHTML=`<b>${esc(t('lang.failed'))}</b>`; return; }
  }
  S.edition=id; S.dir=b.dataset.dir||'ltr';
  fullQuran = S.pool==='all' ? EDCACHE['_arr_'+id] : null;
  if(id.slice(0,3)==='ara' && !document.getElementById('fp-scribe')){
    const l=document.createElement('link'); l.id='fp-scribe'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Amiri:wght@400&display=swap'; document.head.appendChild(l);
  }
  rebuildBag(); closePanels(); showVerse(false);
  renderLangs(langsearch.value.trim().toLowerCase());
  setLanguage(ln);          /* the page follows, without holding up the verse */
});

/* the chosen language changes the whole page, not only the verse */
async function setLanguage(name){
  LANGNAME=name; EXPV=null;
  const code=codeFor(name)||'en';
  store.set('lang',{name});
  store.set('edition',{id:S.edition,dir:S.dir});
  document.documentElement.setAttribute('lang',code);
  document.documentElement.setAttribute('dir',RTLCODES.has(code)?'rtl':'ltr');

  if(trBusy) return;

  wire('seg-ref',v=>{S.showRef=v;store.set('showRef',v);refEl.style.display=(v==='on'&&refEl.innerHTML)?'':'none';});
  wire('seg-pool',setPool);
  wire('seg-explen',v=>{ S.expLen=v; store.set('expLen',v);
    if(EXPV){ const [s,cut]=shorten(EXPV.text,v==='long'?100000:620);
      EXPV.short=s; EXPV.cut=cut; EXPV.open=(v==='long'); paintExplain(); } });
  document.getElementById('clearlikes').addEventListener('click',()=>{
    likes=[]; store.set('likes',likes); renderFavourites(); if(CUR)(CUR.type==='verse'?paintVerse():paintStory());
  });
}
function wire(id,fn){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    fn(b.dataset.v); });
}
async function setPool(v){
  const note=document.getElementById('poolnote');
  if(v==='all'){
    let src = S.edition==='built-in' ? EDCACHE['_arr_all'] : EDCACHE['_arr_'+S.edition];
    if(!src){
      note.textContent='…';
      try{ const j=await fetchJSON('editions/eng-rowwadtranslati.min.json');
        EDCACHE['_arr_all']=j.quran; src=j.quran; }
      catch(e){ note.textContent=t('set.poolSub'); S.pool='curated';
        wireBack('seg-pool','curated'); rebuildBag(); return; }
    }
    fullQuran=src; S.pool='all'; S.mood=null; setPill(t('pill.all')); rebuildBag();
    note.textContent=t('set.poolSub'); showVerse(false);
  }else{
    S.pool='curated'; fullQuran=null; setPill(S.mood?moodName(S.mood):null); rebuildBag();
  }
}
function wireBack(id,v){ const el=document.getElementById(id); if(el)
  el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v))); }

/* ══ about — written from the strings, so it follows the language too ══ */
function buildAbout(){
  const box=document.getElementById('aboutbody'); if(!box) return;
  const sec=(title,body)=>`<div class="gtitle">${esc(t(title))}</div>
    <p class="foot" style="margin-top:0">${esc(t(body))}</p>`;
  box.innerHTML=
    `<p class="lede" style="max-width:52ch">${esc(t('about.lede'))}</p>`+
    sec('about.words','about.wordsBody')+
    sec('about.exp','about.expBody')+
    sec('about.lang','about.langBody')+
    sec('about.word','about.wordBody')+
    `<div class="gtitle">${esc(t('about.contact'))}</div>
     <p class="foot" style="margin-top:0">${esc(t('about.contactBody'))}<br>
     <a href="https://x.com/a1wai" target="_blank" rel="noopener" style="font-family:var(--f-display);font-size:1.2rem">@a1wai</a> on X</p>
     <p class="foot" style="opacity:.7">
       <a href="https://github.com/fawazahmed0/quran-api" target="_blank" rel="noopener">quran-api</a> ·
       <a href="https://github.com/spa5k/tafsir_api" target="_blank" rel="noopener">tafsir_api</a> ·
       <a href="https://quranenc.com" target="_blank" rel="noopener">quranenc.com</a></p>`;
}

/* ══ start ══ */
applyTheme(); applyFont(); applySize();
motionOn=(S.motion==='on');
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ motionOn=false; S.motion='off'; }
sizeCanvas();
setSceneIdx(sceneForGroup('stars',0));
loadDeck();
rebuildBag();

/* the language you were last reading in comes back with you, from this
   device, with no connection: the interface at once, the verses as soon
   as the edition has been fetched again */
const SAVEDLANG=store.get('lang'), SAVEDED=store.get('edition');
if(SAVEDLANG && SAVEDLANG.name && codeFor(SAVEDLANG.name)!=='en'){
  LANGNAME=SAVEDLANG.name;
  const c=codeFor(LANGNAME)||'en';
  document.documentElement.setAttribute('lang',c);
  document.documentElement.setAttribute('dir',RTLCODES.has(c)?'rtl':'ltr');
  applyBucket(LANGNAME);
  setTimeout(prefetchStories,1200);
}else applyStrings();

requestAnimationFrame(frame);
showVerse(true);

if(SAVEDED && SAVEDED.id && SAVEDED.id!=='built-in'){
  (async()=>{
    try{
      const j=await fetchJSON('editions/'+SAVEDED.id+'.min.json');
      EDCACHE[SAVEDED.id]=indexEdition(j.quran); EDCACHE['_arr_'+SAVEDED.id]=j.quran;
      S.edition=SAVEDED.id; S.dir=SAVEDED.dir||'ltr';
      if(SAVEDED.id.slice(0,3)==='ara' && !document.getElementById('fp-scribe')){
        const l=document.createElement('link'); l.id='fp-scribe'; l.rel='stylesheet';
        l.href='https://fonts.googleapis.com/css2?family=Amiri:wght@400&display=swap'; document.head.appendChild(l);
      }
      if(CUR && CUR.type==='verse'){ CUR.text=textFor(CUR.c,CUR.a,CUR.text); paintVerse(); }
      renderFavourites();
    }catch(e){}
  })();
}
const hintEl=document.getElementById('hint');
if(!store.get('seen')){ store.set('seen',1);
  setTimeout(()=>hintEl.classList.add('on'),1400);
  setTimeout(()=>hintEl.classList.remove('on'),9000); }

</script>
